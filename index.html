
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIBE – Reels Feed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
    
    .app { 
      max-width: 430px; 
      margin: auto; 
      height: 100dvh; 
      position: relative; 
      background: #000; 
      overflow: hidden; 
    }
    
    header { 
      height: 56px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 16px; 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      z-index: 20; 
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); 
    }
    .top-tabs { display: flex; gap: 16px; font-weight: 700; font-size: 16px; margin: auto; }
    .top-tab { color: rgba(255, 255, 255, 0.6); cursor: pointer; }
    .top-tab.active { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 2px; }

    /* REELS FEED */
    .reels-feed { 
      height: 100dvh; 
      width: 100%; 
      overflow-y: scroll; 
      snap-type: y mandatory; 
      scrollbar-width: none; 
    }
    .reels-feed::-webkit-scrollbar { display: none; }

    .reel-card { 
      height: 100dvh; 
      width: 100%; 
      snap-align: start; 
      snap-stop: always; 
      position: relative; 
      background: #000; 
    }

    .reel-video-container { width: 100%; height: 100%; position: relative; cursor: pointer; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* REEL OVERLAY CONTENT */
    .reel-overlay {
      position: absolute;
      bottom: 60px;
      left: 0;
      width: 100%;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 50%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    .reel-info { flex: 1; padding-right: 12px; pointer-events: auto; }
    .creator { font-weight: 700; font-size: 16px; margin-bottom: 6px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .caption { font-size: 14px; color: #fff; line-height: 1.35; white-space: pre-line; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

    /* TIKTOK / INSTAGRAM RIGHT SIDE BUTTON BAR */
    .reel-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
      margin-bottom: 10px;
    }

    .action-btn-vertical {
      background: none;
      border: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
    }
    .action-btn-vertical:active { transform: scale(0.85); }
    .action-icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(22, 24, 35, 0.4);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .action-icon-circle svg { width: 26px; height: 26px; fill: #ffffff; }
    
    /* LIKE HEART RED STATE */
    .action-btn-vertical.liked .action-icon-circle svg { fill: #fe2c55; }

    /* TIKTOK STYLE BOTTOM NAV BAR */
    .bottom-nav { 
      position: absolute; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      height: 56px; 
      background: #000; 
      border-top: 0.5px solid rgba(255,255,255,0.12); 
      display: grid; 
      grid-template-columns: repeat(5, 1fr); 
      align-items: center; 
      z-index: 100; 
    }

    .nav-btn { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      color: #a6a7ab; 
      font-size: 10px; 
      font-weight: 500;
      cursor: pointer; 
      border: none; 
      background: none; 
      gap: 2px;
    }
    .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .nav-btn.active { color: #ffffff; }

    /* TIKTOK ICON CREATOR BUTTON (+) */
    .create-btn-wrapper { display: flex; justify-content: center; align-items: center; }
    .create-btn-tiktok { 
      width: 45px; 
      height: 30px; 
      background: #69C9D0; 
      border-radius: 8px; 
      position: relative; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      border: none; 
      cursor: pointer; 
      box-shadow: 3px 0 0 #EE1D52; 
      transition: transform 0.15s ease;
    }
    .create-btn-tiktok:active { transform: scale(0.9); }
    .create-btn-tiktok-inner { 
      width: 39px; 
      height: 100%; 
      background: #ffffff; 
      border-radius: 7px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .create-btn-tiktok-inner svg { width: 16px; height: 16px; fill: #000000; }

    /* FULLSCREEN CREATOR MODAL */
    .create-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      background: #000;
      z-index: 300;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px;
    }
    .create-modal.active { display: flex; }

    .creator-header { display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .close-modal-btn { background: rgba(0,0,0,0.5); border: none; color: #fff; font-size: 24px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }

    .camera-preview-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .camera-preview-container video { width: 100%; height: 100%; object-fit: cover; }

    .creator-bottom-controls {
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }

    .record-controls {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
    }

    .upload-gallery-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .record-trigger-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .record-trigger-btn-inner {
      width: 100%;
      height: 100%;
      background: #fe2c55;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }
    .record-trigger-btn.recording .record-trigger-btn-inner {
      transform: scale(0.55);
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="app">
    <header>
      <div class="top-tabs">
        <span class="top-tab">Following</span>
        <span class="top-tab active">For You</span>
      </div>
    </header>

    <!-- HIDDEN GALLERY INPUT FOR DIRECT FILE SELECTION -->
    <input type="file" id="direct-gallery-input" accept="video/*" style="display: none;" onchange="handleDirectVideoSelect(event)" />

    <!-- HOME / REELS FEED -->
    <div id="home-view" class="view-section active">
      <div class="reels-feed" id="reels-feed" onscroll="handleReelScroll()">
        
        <div class="reel-card">
          <div class="reel-video-container" onclick="toggleVideoPlayback(this)">
            <video src="https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" playsinline loop preload="metadata"></video>
          </div>
          <div class="reel-overlay">
            <div class="reel-info">
              <div class="creator">@rafter6</div>
              <div class="caption">Everybody says stay motivated... I need my bank balance motivated first 😂</div>
            </div>
            
            <!-- TIKTOK / INSTAGRAM STYLE ACTION BUTTONS -->
            <div class="reel-actions">
              <!-- LIKE / HEART -->
              <button class="action-btn-vertical" onclick="this.classList.toggle('liked')">
                <div class="action-icon-circle">
                  <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <span>128K</span>
              </button>

              <!-- COMMENT BUBBLE -->
              <button class="action-btn-vertical">
                <div class="action-icon-circle">
                  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                </div>
                <span>1,240</span>
              </button>

              <!-- BOOKMARK / SAVE -->
              <button class="action-btn-vertical">
                <div class="action-icon-circle">
                  <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                </div>
                <span>854</span>
              </button>

              <!-- SHARE ARROW -->
              <button class="action-btn-vertical">
                <div class="action-icon-circle">
                  <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7 0-.24-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                </div>
                <span>Share</span>
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- TIKTOK BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
      <!-- HOME -->
      <button class="nav-btn active">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </button>

      <!-- FRIENDS / DISCOVER -->
      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <span>Friends</span>
      </button>

      <!-- TIKTOK '+' CREATE BUTTON -->
      <div class="create-btn-wrapper">
        <button class="create-btn-tiktok" onclick="openCreateModal()">
          <div class="create-btn-tiktok-inner">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </div>
        </button>
      </div>

      <!-- INBOX / ALERTS -->
      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        <span>Inbox</span>
      </button>

      <!-- PROFILE -->
      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <!-- VIDEO CREATOR SCREEN MODAL -->
  <div id="create-modal" class="create-modal">
    <div class="creator-header">
      <button class="close-modal-btn" onclick="closeCreateModal()">✕</button>
      <div style="font-weight: 700; font-size: 16px;">Create</div>
      <div style="width: 40px;"></div>
    </div>

    <div class="camera-preview-container">
      <video id="camera-stream" autoplay playsinline muted></video>
    </div>

    <div class="creator-bottom-controls">
      <div class="record-controls">
        <button class="upload-gallery-btn" onclick="openGalleryDirectly()">📁 Upload</button>
        <button id="record-trigger" class="record-trigger-btn" onclick="toggleRecording()">
          <div class="record-trigger-btn-inner"></div>
        </button>
        <div style="width: 75px;"></div>
      </div>
    </div>
  </div>

  <script>
    let cameraStream = null;
    let isRecording = false;

    function toggleVideoPlayback(container) {
      const video = container.querySelector('video');
      if (!video) return;
      video.paused ? video.play() : video.pause();
    }

    function handleReelScroll() {
      const feed = document.getElementById('reels-feed');
      const cards = feed.querySelectorAll('.reel-card');
      const scrollTop = feed.scrollTop;
      const height = feed.clientHeight;

      cards.forEach((card) => {
        const video = card.querySelector('video');
        if (Math.abs(card.offsetTop - scrollTop) < height / 2) {
          if (video && video.paused) {
            video.play().catch(() => {});
          }
        } else {
          if (video && !video.paused) video.pause();
        }
      });
    }

    async function openCreateModal() {
      const modal = document.getElementById('create-modal');
      if (modal) modal.classList.add('active');

      document.querySelectorAll('video').forEach(v => v.pause());

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          const cameraPreview = document.getElementById('camera-stream');
          if (cameraPreview) cameraPreview.srcObject = cameraStream;
        } catch (err) {
          console.warn("Camera permission ungranted or unavailable.", err);
        }
      }
    }

    function closeCreateModal() {
      const modal = document.getElementById('create-modal');
      if (modal) modal.classList.remove('active');

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      handleReelScroll();
    }

    function toggleRecording() {
      const btn = document.getElementById('record-trigger');
      isRecording = !isRecording;
      if (btn) btn.classList.toggle('recording', isRecording);
    }

    function openGalleryDirectly() {
      const galleryInput = document.getElementById('direct-gallery-input');
      if (galleryInput) galleryInput.click();
    }

    function handleDirectVideoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const videoUrl = URL.createObjectURL(file);
      const feed = document.getElementById('reels-feed');

      const newReel = document.createElement('div');
      newReel.className = 'reel-card';
      newReel.innerHTML = `
        <div class="reel-video-container" onclick="toggleVideoPlayback(this)">
          <video src="${videoUrl}" playsinline loop preload="metadata"></video>
        </div>
        <div class="reel-overlay">
          <div class="reel-info">
            <div class="creator">@you</div>
            <div class="caption">New post 🔥</div>
          </div>
          <div class="reel-actions">
            <button class="action-btn-vertical" onclick="this.classList.toggle('liked')">
              <div class="action-icon-circle">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              </div>
              <span>0</span>
            </button>
            <button class="action-btn-vertical">
              <div class="action-icon-circle">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
              </div>
              <span>0</span>
            </button>
            <button class="action-btn-vertical">
              <div class="action-icon-circle">
                <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
              </div>
              <span>0</span>
            </button>
            <button class="action-btn-vertical">
              <div class="action-icon-circle">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7 0-.24-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
              </div>
              <span>Share</span>
            </button>
          </div>
        </div>
      `;

      feed.prepend(newReel);
      closeCreateModal();
      feed.scrollTop = 0;
      handleReelScroll();
      event.target.value = '';
    }

    window.addEventListener('DOMContentLoaded', () => {
      handleReelScroll();
    });
  </script>
</body>
</html>

```
