<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VIBE – Reels Feed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; height: 100vh; }
    
    .app { max-width: 430px; margin: auto; height: 100vh; position: relative; background: #0c0d12; overflow: hidden; display: flex; flex-direction: column; }
    
    header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: absolute; top: 0; left: 0; width: 100%; z-index: 50; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
    .logo { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #fff; }
    .header-controls { display: flex; align-items: center; gap: 8px; }
    .global-mute-btn { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; backdrop-filter: blur(8px); }
    .badge { background: rgba(255,255,255,0.15); padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; backdrop-filter: blur(8px); }
    
    .view-section { height: calc(100vh - 65px); width: 100%; position: absolute; top: 0; left: 0; display: none; }
    .view-section.active { display: block; }

    /* REELS FEED (VERTICAL SWIPE) */
    .reels-feed { 
      height: 100%; 
      width: 100%; 
      overflow-y: scroll; 
      snap-type: y mandatory; 
      scrollbar-width: none; 
    }
    .reels-feed::-webkit-scrollbar { display: none; }

    .reel-card { 
      height: 100%; 
      width: 100%; 
      snap-align: start; 
      snap-stop: always; 
      position: relative; 
      background: #000; 
    }

    .reel-video-container { width: 100%; height: 100%; position: relative; cursor: pointer; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* FLOATING DURATION BADGE */
    .duration-badge {
      position: absolute;
      top: 68px;
      left: 16px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(4px);
    }
    .duration-badge.visible { opacity: 1; }

    /* REEL OVERLAY */
    .reel-overlay {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    .reel-info { flex: 1; padding-right: 16px; pointer-events: auto; }
    .creator { font-weight: 800; font-size: 15px; margin-bottom: 6px; color: #fff; }
    .caption { font-size: 13px; color: #eee; line-height: 1.4; }

    /* FLOATING RIGHT ACTIONS */
    .reel-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
    }

    .action-btn-vertical {
      background: none;
      border: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .action-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .action-btn-vertical.liked .action-icon { color: #ff4d79; }

    /* BOTTOM NAVIGATION BAR */
    .bottom-nav { 
      position: fixed; 
      bottom: 0; 
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: 65px; 
      background: #0c0d12; 
      border-top: 1px solid rgba(255,255,255,0.1); 
      display: grid; 
      grid-template-columns: repeat(5, 1fr); 
      align-items: center; 
      z-index: 100; 
    }

    .nav-btn { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      color: #8e8e93; 
      font-size: 10px; 
      font-weight: 500;
      cursor: pointer; 
      border: none; 
      background: none; 
      gap: 3px;
    }
    .nav-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
    .nav-btn.active { color: #ff4d79; }
    .nav-btn.active svg { stroke: #ff4d79; }

    /* CREATE BUTTON */
    .create-btn-wrapper { display: flex; justify-content: center; align-items: center; }
    .create-btn { 
      width: 46px; 
      height: 30px; 
      background: #00f2fe; 
      border-radius: 8px; 
      position: relative; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      border: none; 
      cursor: pointer; 
      box-shadow: -3px 0 0 #ff0050, 3px 0 0 #00f2fe; 
    }
    .create-btn-inner { 
      width: 100%; 
      height: 100%; 
      background: #ffffff; 
      border-radius: 6px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .create-btn-inner svg { width: 16px; height: 16px; stroke: #000; stroke-width: 3; }

    /* MODAL */
    .create-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 300;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px;
    }
    .create-modal.active { display: flex; }
    .close-modal-btn { background: rgba(0,0,0,0.5); border: none; color: #fff; font-size: 24px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app">
    <header>
      <div class="logo">VIBE</div>
      <div class="header-controls">
        <button id="global-mute-btn" class="global-mute-btn" onclick="toggleGlobalMute()">🔊 Sound On</button>
        <div class="badge">🇿🇦 SA Reels</div>
      </div>
    </header>

    <input type="file" id="direct-gallery-input" accept="video/*" style="display: none;" onchange="handleDirectVideoSelect(event)" />

    <!-- HOME / REELS FEED -->
    <div id="home-view" class="view-section active">
      <div class="reels-feed" id="reels-feed" onscroll="handleReelScroll()">
        
        <div class="reel-card">
          <div class="reel-video-container" onclick="toggleVideoPlayback(this)">
            <video src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" playsinline loop autoplay muted></video>
            <div class="duration-badge">0:00 / 0:00</div>
          </div>
          <div class="reel-overlay">
            <div class="reel-info">
              <div class="creator">@rafter6</div>
              <div class="caption">Everybody says stay motivated... I need my bank balance motivated first 😂</div>
            </div>
            <div class="reel-actions">
              <button class="action-btn-vertical" onclick="toggleLike(this, 128)">
                <div class="action-icon">❤️</div>
                <span>128</span>
              </button>
              <button class="action-btn-vertical">
                <div class="action-icon">💬</div>
                <span>24</span>
              </button>
              <button class="action-btn-vertical" onclick="openCreateModal()">
                <div class="action-icon">➕</div>
                <span>Create</span>
              </button>
              <button class="action-btn-vertical">
                <div class="action-icon">⋮</div>
                <span>More</span>
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- BOTTOM FIXED NAVIGATION -->
    <nav class="bottom-nav">
      <button class="nav-btn active">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Reels</span>
      </button>

      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Discover</span>
      </button>

      <div class="create-btn-wrapper">
        <button class="create-btn" onclick="openCreateModal()">
          <div class="create-btn-inner">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </div>
        </button>
      </div>

      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg>
        <span>Alerts</span>
      </button>

      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <!-- CREATE VIDEO SCREEN -->
  <div id="create-modal" class="create-modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <button class="close-modal-btn" onclick="closeCreateModal()">✕</button>
      <div style="font-weight:bold;">Create Reel</div>
      <div style="width:40px;"></div>
    </div>

    <div style="flex:1; display:flex; justify-content:center; align-items:center; flex-direction:column; gap:20px;">
      <button onclick="openGalleryDirectly()" style="background:#fe2c55; color:#fff; border:none; padding:14px 28px; border-radius:30px; font-weight:bold; font-size:16px; cursor:pointer;">
        📁 Upload Video from Gallery
      </button>
    </div>
  </div>

  <script>
    let isGlobalMuted = true;

    function toggleGlobalMute() {
      isGlobalMuted = !isGlobalMuted;
      document.getElementById('global-mute-btn').textContent = isGlobalMuted ? '🔇 Muted' : '🔊 Sound On';
      document.querySelectorAll('video').forEach(v => { v.muted = isGlobalMuted; });
    }

    function toggleVideoPlayback(container) {
      const video = container.querySelector('video');
      if (!video) return;
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    function openCreateModal() {
      document.getElementById('create-modal').classList.add('active');
    }

    function closeCreateModal() {
      document.getElementById('create-modal').classList.remove('active');
    }

    function openGalleryDirectly() {
      document.getElementById('direct-gallery-input').click();
    }

    function handleDirectVideoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const videoUrl = URL.createObjectURL(file);
      const feed = document.getElementById('reels-feed');

      const newReel = document.createElement('div');
      newReel.className = 'reel-card';
      newReel.innerHTML = `
        <div class="reel-video-container" onclick="toggleVideoPlayback(this)">
          <video src="${videoUrl}" playsinline loop autoplay muted></video>
        </div>
        <div class="reel-overlay">
          <div class="reel-info">
            <div class="creator">@you</div>
            <div class="caption">New uploaded reel 🔥</div>
          </div>
        </div>
      `;

      feed.prepend(newReel);
      closeCreateModal();
      feed.scrollTop = 0;
    }

    function toggleLike(element, count) {
      element.classList.toggle('liked');
    }
  </script>
</body>
</html>
