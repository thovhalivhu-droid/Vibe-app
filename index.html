<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE - Short-Form Video Platform</title>

    <style>
        :root {
            --bg-color: #0f1015;
            --surface-color: #1a1b22;
            --surface-glass: rgba(26, 27, 34, 0.75);
            --primary-color: #ff2a5f;
            --secondary-color: #00f2fe;
            --text-main: #ffffff;
            --text-muted: #8a8d9b;
            --border-color: rgba(255, 255, 255, 0.08);
            --nav-height: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            background: var(--bg-color);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 481px) {
            #app {
                height: 90vh;
                max-height: 860px;
                border-radius: 24px;
                border: 1px solid var(--border-color);
            }
        }

        /* HEADER */
        .app-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 20;
            background: linear-gradient(
                to bottom,
                rgba(15,16,21,0.8),
                transparent
            );
        }

        .app-logo {
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.5px;
            background: linear-gradient(
                45deg,
                var(--primary-color),
                var(--secondary-color)
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-tabs {
            display: flex;
            gap: 20px;
            font-size: 15px;
            font-weight: 600;
        }

        .header-tab {
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
            position: relative;
        }

        .header-tab.active {
            color: var(--text-main);
        }

        .header-tab.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 3px;
            background: var(--primary-color);
            border-radius: 2px;
        }

        /* FEED */
        .feed-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            touch-action: pan-y;
        }

        .feed-container::-webkit-scrollbar {
            display: none;
        }

        .reel-card {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .reel-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            cursor: pointer;
        }

        /* DOUBLE TAP HEART */
        .double-tap-heart {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 90px;
            z-index: 50;
            pointer-events: none;
            opacity: 1;
            transition:
                transform 0.35s ease,
                opacity 0.35s ease;
        }

        .double-tap-heart.show {
            transform: translate(-50%, -50%) scale(1.2);
        }

        .double-tap-heart.hide {
            transform: translate(-50%, -50%) scale(1.5);
            opacity: 0;
        }

        /* SOUND INDICATOR */
        .sound-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition:
                opacity 0.2s,
                transform 0.2s;
            font-size: 28px;
        }

        .sound-indicator.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* OVERLAY */
        .reel-overlay {
            position: absolute;
            bottom: calc(var(--nav-height) + 16px);
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            background: linear-gradient(
                to top,
                rgba(0,0,0,0.8) 0%,
                rgba(0,0,0,0.4) 60%,
                transparent 100%
            );
            z-index: 10;
            pointer-events: none;
        }

        .reel-overlay > * {
            pointer-events: auto;
        }

        .reel-info {
            max-width: 72%;
        }

        .reel-author {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .author-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
            object-fit: cover;
        }

        .author-name {
            font-weight: 700;
            font-size: 15px;
        }

        .follow-btn {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .reel-caption {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .reel-audio-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ACTIONS */
        .reel-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            background: none;
            border: none;
            color: #fff;
        }

        .action-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, background 0.2s;
        }

        .action-item:active .action-icon-box {
            transform: scale(0.9);
        }

        .action-item.liked .action-icon-box svg {
            fill: var(--primary-color);
            stroke: var(--primary-color);
        }

        .action-count {
            font-size: 12px;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* NAV */
        .nav-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
            padding: 0 10px;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 500;
            width: 20%;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--text-main);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-item.active svg {
            fill: currentColor;
        }

        .create-nav-btn {
            width: 40px;
            height: 28px;
            background: linear-gradient(
                135deg,
                var(--primary-color),
                var(--secondary-color)
            );
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 42, 95, 0.4);
        }

        .create-nav-btn svg {
            stroke: #fff;
            fill: none;
        }

        /* SCREENS */
        .app-screen {
            position: absolute;
            inset: 0;
            background: var(--bg-color);
            z-index: 30;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .app-screen.open {
            transform: translateY(0);
        }

        .screen-header {
            height: 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 16px;
        }

        .screen-close-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 20px;
        }

        /* CAMERA */
        #studio-screen {
            background: #000;
        }

        .camera-viewport {
            position: relative;
            flex: 1;
            width: 100%;
            background: #111;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #camera-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .studio-controls {
            height: 160px;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 15px 0;
        }

        .filter-scroller {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            width: 100%;
            padding: 0 20px;
            scrollbar-width: none;
        }

        .filter-pill {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-pill.active {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }

        .shutter-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            padding: 0 40px;
        }

        .shutter-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .shutter-inner {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--primary-color);
            transition: border-radius 0.2s;
        }

        .shutter-btn.recording .shutter-inner {
            border-radius: 12px;
            transform: scale(0.75);
            background: #ff3b30;
        }

        /* INBOX */
        .inbox-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .chat-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            cursor: pointer;
        }

        .chat-row:hover {
            background: var(--surface-color);
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-details {
            flex: 1;
        }

        .chat-name {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .chat-snippet {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* PROFILE */
        .profile-header-sec {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .profile-avatar-large {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            object-fit: cover;
            margin-bottom: 12px;
        }

        .profile-handle {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .profile-bio {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 16px;
        }

        .profile-stats {
            display: flex;
            gap: 30px;
            text-align: center;
        }

        .stat-value {
            font-weight: 700;
            font-size: 16px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .profile-grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            padding: 2px;
        }

        .grid-item {
            aspect-ratio: 9/16;
            background: #222;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* TOAST */
        #toast {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0,0,0,0.85);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100;
            white-space: nowrap;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

<div id="app">

    <div id="toast">Action completed</div>

    <!-- HEADER -->
    <header class="app-header">

        <div class="app-logo">VIBE</div>

        <div class="header-tabs">
            <div class="header-tab active" data-feed="following">
                Following
            </div>

            <div class="header-tab" data-feed="foryou">
                For You
            </div>
        </div>

        <div style="width:24px;"></div>

    </header>


    <!-- FEED -->
    <div class="feed-container" id="feedContainer"></div>


    <!-- BOTTOM NAV -->
    <nav class="nav-bar">

        <button class="nav-item active" data-tab="home">

            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>

            Home

        </button>


        <button class="nav-item" data-tab="discover">

            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>

            Discover

        </button>


        <button class="nav-item" data-tab="create">

            <div class="create-nav-btn">

                <svg viewBox="0 0 24 24" width="18" height="18">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>

            </div>

        </button>


        <button class="nav-item" data-tab="inbox">

            <svg viewBox="0 0 24 24">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>

            Inbox

        </button>


        <button class="nav-item" data-tab="profile">

            <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>

            Me

        </button>

    </nav>


    <!-- CREATE / CAMERA -->
    <div class="app-screen" id="studio-screen">

        <div class="screen-header">

            <button class="screen-close-btn" id="closeStudio">
                ✕
            </button>

            <span>Record Reel</span>

            <div style="width:24px;"></div>

        </div>


        <div class="camera-viewport">

            <video
                id="camera-preview"
                autoplay
                playsinline
                muted>
            </video>

        </div>


        <div class="studio-controls">

            <div class="filter-scroller">

                <div class="filter-pill active" data-filter="none">
                    Normal
                </div>

                <div class="filter-pill"
                     data-filter="sepia(0.6) contrast(1.1)">
                    Vintage
                </div>

                <div class="filter-pill"
                     data-filter="grayscale(1)">
                    B&W
                </div>

                <div class="filter-pill"
                     data-filter="hue-rotate(90deg) saturate(1.5)">
                    Neon
                </div>

                <div class="filter-pill"
                     data-filter="brightness
