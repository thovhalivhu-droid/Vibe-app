<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlindSpot - Viral Canvas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- HOME SCREEN -->
        <div id="home-screen" class="screen active">
            <h1>BlindSpot</h1>
            <p>Drop a prompt. Lock the room. Wait for the reveal.</p>
            <div class="card-box">
                <input type="text" id="prompt-input" placeholder="e.g., Hot takes about our friend group...">
                <button id="create-room-btn">Create Viral Room</button>
            </div>
        </div>

        <!-- ROOM / CANVAS SCREEN -->
        <div id="room-screen" class="screen">
            <header>
                <h2 id="room-title">Loading Prompt...</h2>
                <div id="timer-box">Unlocks in: <span id="countdown">00:30</span></div>
            </header>

            <!-- Submission Form (Hidden once submitted or locked) -->
            <div id="submission-container">
                <textarea id="user-submission" placeholder="Drop your anonymous card..."></textarea>
                <button id="submit-card-btn">Drop Card (Locked until timer ends)</button>
            </div>

            <!-- The Grid Canvas -->
            <div id="canvas-grid" class="locked">
                <!-- Cards will render here dynamically -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
