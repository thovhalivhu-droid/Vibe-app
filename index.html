<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VIBE – Reels Feed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; height: 100vh; }
    
    .app { max-width: 430px; margin: auto; height: 100vh; position: relative; background: #0c0d12; overflow: hidden; display: flex; flex-direction: column; }
    
    header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: absolute; top: 0; left: 0; width: 100%; z-index: 50; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
    .logo { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #fff; }
    .header-controls { display: flex; align-items: center; gap: 8px; }
    .global-mute-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; backdrop-filter: blur(8px); font-weight: bold; }
    .badge { background: rgba(255,255,255,0.15); padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; backdrop-filter: blur(8px); }
    
    .view-section { height: calc(100vh - 65px); width: 100%; position: absolute; top: 0; left: 0; display: block; }

    /* REELS FEED */
    .reels-feed { height: 100%; width: 100%; overflow-y: scroll; snap-type: y mandatory; scrollbar-width: none; }
    .reels-feed::-webkit-scrollbar { display: none; }

    .reel-card { height: 100%; width: 100%; snap-align: start; snap-stop: always; position: relative; background: #000; }
    .reel-video-container { width: 100%; height: 100%; position: relative; cursor: pointer; }
    video, img.media-preview { width: 100%; height: 100%; object-fit: cover; }

    .unmute-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      z-index: 20;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.2);
      transition: opacity 0.3s ease;
    }
    .unmute-overlay.hidden { opacity: 0; }

    .reel-overlay {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    .reel-info { flex: 1; padding-right: 16px; pointer-events: auto; }
    .creator { font-weight: 800; font-size: 15px; margin-bottom: 6px; color: #fff; }
    .caption { font-size: 13px; color: #eee; line-height: 1.4; }

    .reel-actions { display: flex; flex-direction: column; align-items: center; gap: 16px; pointer-events: auto; }
    .action-btn-vertical { background: none; border: none; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; }
    .action-icon { width: 42px; height: 42px; border-radius: 50%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; font-size: 20px; }

    /* BOTTOM NAV */
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: 65px; background: #0c0d12; border-top: 1px solid rgba(255,255,255,0.1); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; z-index: 100; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8e8e93; font-size: 10px; font-weight: 500; cursor: pointer; border: none; background: none; gap: 3px; }
    .nav-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
    .nav-btn.active { color: #ff4d79; }
    .nav-btn.active svg { stroke: #ff4d79; }

    .create-btn-wrapper { display: flex; justify-content: center; align-items: center; }
    .create-btn { width: 46px; height: 30px; background: #00f2fe; border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; box-shadow: -3px 0 0 #ff0050, 3px 0 0 #00f2fe; }
    .create-btn-inner { width: 100%; height: 100%; background: #ffffff; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .create-btn-inner svg { width: 16px; height: 16px; stroke: #000; stroke-width: 3; }

    /* CREATE MODAL */
    .create-modal {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: #121318;
      z-index: 200;
      display: none;
      flex-direction: column;
      padding: 20px;
      justify-content: space-between;
    }
    .create-modal.active { display: flex; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-title { font-size: 18px; font-weight: bold; }
    .close-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
    
    .media-preview-box {
      border: 2px dashed rgba(255,255,255,0.3);
      border-radius: 12px;
      height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #aaa;
      background: #1c1d24;
      overflow: hidden;
      position: relative;
    }
    .media-preview-box video, .media-preview-box img { display: none; width: 100%; height: 100%; object-fit: cover; }
    
    .upload-buttons { display: flex; gap: 10px; margin-top: 12px; }
    .btn-select { flex: 1; background: #1c1d24; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 10px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; }
    
    .caption-input {
      width: 100%;
      height: 90px;
      background: #1c1d24;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-family: inherit;
      resize: none;
      margin-top: 12px;
    }
    .caption-input:focus { outline: 1px solid #ff4d79; }

    .publish-btn {
      width: 100%;
      background: linear-gradient(90deg, #ff0050, #ff4d79);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="app">
    <header>
      <div class="logo">VIBE</div>
      <div class="header-controls">
        <button id="global-mute-btn" class="global-mute-btn" onclick="toggleGlobalMute()">🔇 Sound Off</button>
        <div class="badge">🇿🇦 SA Reels</div>
      </div>
    </header>

    <div id="home-view" class="view-section">
      <div class="reels-feed" id="reels-feed">
        
        <!-- REEL 1 -->
        <div class="reel-card">
          <div class="reel-video-container" onclick="togglePlayPause(this)">
            <video class="feed-video" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" playsinline loop muted></video>
            <div class="unmute-overlay">🔊 Tap screen for sound</div>
          </div>
          <div class="reel-overlay">
            <div class="reel-info">
              <div class="creator">@rafter6</div>
              <div class="caption">Everybody says stay motivated... I need my bank balance motivated first 😂</div>
            </div>
            <div class="reel-actions">
              <button class="action-btn-vertical"><div class="action-icon">❤️</div><span>128</span></button>
              <button class="action-btn-vertical"><div class="action-icon">💬</div><span>24</span></button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- CREATE REEL MODAL -->
    <div id="create-modal" class="create-modal">
      <div>
        <div class="modal-header">
          <div class="modal-title">Create Reel</div>
          <button class="close-btn" onclick="closeCreateModal()">✕</button>
        </div>
        
        <div class="media-preview-box">
          <span id="upload-placeholder">📸 Record or upload media</span>
          <video id="preview-video" controls></video>
          <img id="preview-image" alt="Preview">
        </div>

        <div class="upload-buttons">
          <!-- Opens direct phone camera for video or photo -->
          <label for="camera-input" class="btn-select">📷 Camera</label>
          <!-- Opens gallery file manager -->
          <label for="gallery-input" class="btn-select">📁 Gallery</label>
        </div>

        <input type="file" id="camera-input" accept="image/*,video/*" capture="environment" style="display:none;" onchange="handleMediaSelect(event)">
        <input type="file" id="gallery-input" accept="image/*,video/*" style="display:none;" onchange="handleMediaSelect(event)">

        <textarea id="reel-caption" class="caption-input" placeholder="Write a caption..."></textarea>
      </div>

      <button class="publish-btn" onclick="publishReel()">Post Reel</button>
    </div>

    <nav class="bottom-nav">
      <button class="nav-btn active">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Reels</span>
      </button>
      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Discover</span>
      </button>
      <div class="create-btn-wrapper">
        <button class="create-btn" onclick="openCreateModal()">
          <div class="create-btn-inner">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </div>
        </button>
      </div>
      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg>
        <span>Alerts</span>
      </button>
      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script>
    let isGlobalMuted = true;
    let selectedMediaUrl = null;
    let selectedMediaType = null; // 'video' or 'image'

    // IntersectionObserver for playing active video in scroll feed
    const observerOptions = {
      root: document.getElementById('reels-feed'),
      threshold: 0.6
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target.querySelector('video');
        if (!video) return;

        if (entry.isIntersecting) {
          video.currentTime = 0;
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });
    }, observerOptions);

    document.querySelectorAll('.reel-card').forEach(card => observer.observe(card));

    function togglePlayPause(container) {
      const video = container.querySelector('video');
      if (!video) return;
      
      if (isGlobalMuted) {
        isGlobalMuted = false;
        document.querySelectorAll('.feed-video').forEach(v => { v.muted = false; });
        document.getElementById('global-mute-btn').textContent = '🔊 Sound On';
        document.querySelectorAll('.unmute-overlay').forEach(el => el.classList.add('hidden'));
      } else {
        if (video.paused) {
          video.play();
        } else {
          video.pause();
        }
      }
    }

    function toggleGlobalMute() {
      isGlobalMuted = !isGlobalMuted;
      document.querySelectorAll('.feed-video').forEach(v => { v.muted = isGlobalMuted; });
      document.getElementById('global-mute-btn').textContent = isGlobalMuted ? '🔇 Sound Off' : '🔊 Sound On';
      
      if (!isGlobalMuted) {
        document.querySelectorAll('.unmute-overlay').forEach(el => el.classList.add('hidden'));
      }
    }

    /* CREATE MODAL & MEDIA HANDLERS */
    function openCreateModal() {
      document.getElementById('create-modal').classList.add('active');
    }

    function closeCreateModal() {
      document.getElementById('create-modal').classList.remove('active');
    }

    function handleMediaSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      selectedMediaUrl = URL.createObjectURL(file);
      const videoPreview = document.getElementById('preview-video');
      const imgPreview = document.getElementById('preview-image');
      const placeholder = document.getElementById('upload-placeholder');

      placeholder.style.display = 'none';

      if (file.type.startsWith('video/')) {
        selectedMediaType = 'video';
        imgPreview.style.display = 'none';
        videoPreview.src = selectedMediaUrl;
        videoPreview.style.display = 'block';
      } else if (file.type.startsWith('image/')) {
        selectedMediaType = 'image';
        videoPreview.style.display = 'none';
        imgPreview.src = selectedMediaUrl;
        imgPreview.style.display = 'block';
      }
    }

    function publishReel() {
      const captionText = document.getElementById('reel-caption').value || "New Post!";
      const feed = document.getElementById('reels-feed');

      if (!selectedMediaUrl) {
        alert("Please record or select a video/photo first!");
        return;
      }

      const newCard = document.createElement('div');
      newCard.className = 'reel-card';

      if (selectedMediaType === 'video') {
        newCard.innerHTML = `
          <div class="reel-video-container" onclick="togglePlayPause(this)">
            <video class="feed-video" src="${selectedMediaUrl}" playsinline loop muted></video>
            <div class="unmute-overlay ${!isGlobalMuted ? 'hidden' : ''}">🔊 Tap screen for sound</div>
          </div>
          <div class="reel-overlay">
            <div class="reel-info">
              <div class="creator">@you</div>
              <div class="caption">${captionText}</div>
            </div>
            <div class="reel-actions">
              <button class="action-btn-vertical"><div class="action-icon">❤️</div><span>0</span></button>
              <button class="action-btn-vertical"><div class="action-icon">💬</div><span>0</span></button>
            </div>
          </div>
        `;
        observer.observe(newCard);
      } else {
        newCard.innerHTML = `
          <div class="reel-video-container">
            <img src="${selectedMediaUrl}" class="media-preview" alt="User Photo">
          </div>
          <div class="reel-overlay">
            <div class="reel-info">
              <div class="creator">@you</div>
              <div class="caption">${captionText}</div>
            </div>
            <div class="reel-actions">
              <button class="action-btn-vertical"><div class="action-icon">❤️</div><span>0</span></button>
              <button class="action-btn-vertical"><div class="action-icon">💬</div><span>0</span></button>
            </div>
          </div>
        `;
      }

      feed.prepend(newCard);
      closeCreateModal();
      feed.scrollTop = 0;

      // Reset form controls
      document.getElementById('reel-caption').value = '';
      document.getElementById('preview-video').style.display = 'none';
      document.getElementById('preview-image').style.display = 'none';
      document.getElementById('upload-placeholder').style.display = 'block';
      selectedMediaUrl = null;
      selectedMediaType = null;
    }
  </script>
</body>
</html>
