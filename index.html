<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIBE – Reels Feed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
    
    .app { 
      max-width: 430px; 
      margin: auto; 
      height: 100dvh; 
      position: relative; 
      background: #000; 
      overflow: hidden; 
    }
    
    header { 
      height: 56px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 16px; 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      z-index: 20; 
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); 
    }
    .top-tabs { display: flex; gap: 16px; font-weight: 700; font-size: 16px; margin: auto; }
    .top-tab { color: rgba(255, 255, 255, 0.6); cursor: pointer; }
    .top-tab.active { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 2px; }

    /* REELS FEED */
    .reels-feed { 
      height: 100dvh; 
      width: 100%; 
      overflow-y: scroll; 
      snap-type: y proximity; 
      scrollbar-width: none; 
      scroll-behavior: smooth;
    }
    .reels-feed::-webkit-scrollbar { display: none; }

    .reel-card { 
      height: 100dvh; 
      width: 100%; 
      snap-align: start; 
      position: relative; 
      background: #000; 
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reel-video-container { width: 100%; height: 100%; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #000; }
    
    video, img.feed-photo { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      background: #000;
    }

    /* REEL OVERLAY CONTENT */
    .reel-overlay {
      position: absolute;
      bottom: 60px;
      left: 0;
      width: 100%;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 50%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    .reel-info { flex: 1; padding-right: 12px; pointer-events: auto; }
    .creator { font-weight: 700; font-size: 16px; margin-bottom: 6px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .caption { font-size: 14px; color: #fff; line-height: 1.35; white-space: pre-line; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

    /* RIGHT SIDE ACTION BUTTONS */
    .reel-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
      margin-bottom: 10px;
    }

    .action-btn-vertical {
      background: none;
      border: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
    }
    .action-btn-vertical:active { transform: scale(0.85); }
    .action-icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(22, 24, 35, 0.4);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .action-icon-circle svg { width: 26px; height: 26px; fill: #ffffff; }
    .action-btn-vertical.liked .action-icon-circle svg { fill: #fe2c55; }

    /* BOTTOM NAV BAR */
    .bottom-nav { 
      position: absolute; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      height: 56px; 
      background: #000; 
      border-top: 0.5px solid rgba(255,255,255,0.12); 
      display: grid; 
      grid-template-columns: repeat(5, 1fr); 
      align-items: center; 
      z-index: 100; 
    }

    .nav-btn { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      color: #a6a7ab; 
      font-size: 10px; 
      font-weight: 500;
      cursor: pointer; 
      border: none; 
      background: none; 
      gap: 2px;
    }
    .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .nav-btn.active { color: #ffffff; }

    .create-btn-wrapper { display: flex; justify-content: center; align-items: center; }
    .create-btn-tiktok { 
      width: 45px; 
      height: 30px; 
      background: #69C9D0; 
      border-radius: 8px; 
      position: relative; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      border: none; 
      cursor: pointer; 
      box-shadow: 3px 0 0 #EE1D52; 
      transition: transform 0.15s ease;
    }
    .create-btn-tiktok:active { transform: scale(0.9); }
    .create-btn-tiktok-inner { 
      width: 39px; 
      height: 100%; 
      background: #ffffff; 
      border-radius: 7px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .create-btn-tiktok-inner svg { width: 16px; height: 16px; fill: #000000; }

    /* CREATOR MODAL */
    .create-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      background: #000;
      z-index: 300;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px;
    }
    .create-modal.active { display: flex; }

    .creator-header { display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .close-modal-btn, .rotate-cam-btn { 
      background: rgba(0,0,0,0.5); 
      border: none; 
      color: #fff; 
      font-size: 18px; 
      width: 40px; 
      height: 40px; 
      border-radius: 50%; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .rotate-cam-btn svg { width: 22px; height: 22px; fill: #fff; }

    .camera-preview-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .camera-preview-container video { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      transition: filter 0.3s ease;
    }

    /* FILTER STYLES */
    .filter-none { filter: none; }
    .filter-vintage { filter: sepia(0.5) contrast(1.1) brightness(0.9); }
    .filter-bw { filter: grayscale(1); }
    .filter-warm { filter: sepia(0.3) saturate(1.4) hue-rotate(-10deg); }
    .filter-vivid { filter: saturate(1.8) contrast(1.2); }
    .filter-soft { filter: brightness(1.1) blur(0.5px) contrast(0.95); }

    /* FILTERS SCROLL BAR */
    .filter-bar {
      width: 100%;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 8px 4px;
      margin-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-chip {
      padding: 6px 14px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
    }
    .filter-chip.active {
      background: #fe2c55;
      border-color: #fe2c55;
    }

    /* MODE SELECTOR (PHOTO / VIDEO SWITCH) */
    .mode-selector {
      display: flex;
      gap: 20px;
      margin-bottom: 8px;
    }
    .mode-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }
    .mode-btn.active {
      color: #ffffff;
      text-shadow: 0 0 6px rgba(255,255,255,0.6);
    }

    .creator-bottom-controls {
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
      width: 100%;
    }

    .record-controls {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
    }

    .upload-gallery-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    /* SHUTTER / RECORD BUTTON */
    .record-trigger-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .record-trigger-btn-inner {
      width: 100%;
      height: 100%;
      background: #fe2c55; /* Default Video Mode */
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    /* Photo mode shutter inner */
    .record-trigger-btn.photo-mode .record-trigger-btn-inner {
      background: #ffffff;
    }

    /* Recording state */
    .record-trigger-btn.recording .record-trigger-btn-inner {
      transform: scale(0.55);
      border-radius: 8px;
      background: #fe2c55;
    }
  </style>
</head>
<body>

  <div class="app">
    <header>
      <div class="top-tabs">
        <span class="top-tab">Following</span>
        <span class="top-tab active">For You</span>
      </div>
    </header>

    <input type="file" id="direct-gallery-input" accept="video/*,image/*" style="display: none;" onchange="handleDirectVideoSelect(event)" />

    <div id="home-view" class="view-section active">
      <div class="reels-feed" id="reels-feed" onscroll="handleReelScroll()">
        
        <div class="reel-card">
          <div class="reel-video-container" onclick="toggleVideoPlayback(this)">
            <video src="https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" playsinline loop autoplay muted preload="metadata"></video>
          </div>
          <div class="reel-overlay">
            <div class="reel-info">
              <div class="creator">@rafter6</div>
              <div class="caption">Everybody says stay motivated... I need my bank balance motivated first 😂</div>
            </div>
            
            <div class="reel-actions">
              <button class="action-btn-vertical" onclick="this.classList.toggle('liked')">
                <div class="action-icon-circle">
                  <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <span>128K</span>
              </button>

              <button class="action-btn-vertical">
                <div class="action-icon-circle">
                  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                </div>
                <span>1,240</span>
              </button>

              <button class="action-btn-vertical">
                <div class="action-icon-circle">
                  <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                </div>
                <span>854</span>
              </button>

              <button class="action-btn-vertical">
                <div class="action-icon-circle">
                  <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7 0-.24-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                </div>
                <span>Share</span>
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-btn active">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </button>

      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <span>Friends</span>
      </button>

      <div class="create-btn-wrapper">
        <button class="create-btn-tiktok" onclick="openCreateModal()">
          <div class="create-btn-tiktok-inner">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </div>
        </button>
      </div>

      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        <span>Inbox</span>
      </button>

      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <!-- CREATOR MODAL -->
  <div id="create-modal" class="create-modal">
    <div class="creator-header">
      <button class="close-modal-btn" onclick="closeCreateModal()">✕</button>
      <div style="font-weight: 700; font-size: 16px;">Create</div>
      <button class="rotate-cam-btn" onclick="switchCamera()" title="Flip Camera">
        <svg viewBox="0 0 24 24"><path d="M9.37 5.51A7 7 0 0 0 4 12c0 3.87 3.13 7 7 7 3.53 0 6.43-2.61 6.92-6h-2.06c-.46 2.28-2.48 4-4.86 4-2.76 0-5-2.24-5-5 0-2.05 1.23-3.81 3-4.58V11l4-3.5L9 4v1.51zM14.63 18.49A7 7 0 0 0 20 12c0-3.87-3.13-7-7-7-3.53 0-6.43 2.61-6.92 6h2.06c.46-2.28 2.48-4 4.86-4 2.76 0 5 2.24 5 5 0 2.05-1.23 3.81-3 4.58V13l-4 3.5 4 3.5v-1.51z"/></svg>
      </button>
    </div>

    <div class="camera-preview-container">
      <video id="camera-stream" class="filter-none" autoplay playsinline muted></video>
    </div>

    <div class="creator-bottom-controls">
      <!-- LIVE FILTER SELECTOR -->
      <div class="filter-bar">
        <button class="filter-chip active" onclick="applyFilter('filter-none', this)">Normal</button>
        <button class="filter-chip" onclick="applyFilter('filter-vintage', this)">Vintage</button>
        <button class="filter-chip" onclick="applyFilter('filter-bw', this)">B&W</button>
        <button class="filter-chip" onclick="applyFilter('filter-warm', this)">Warm</button>
        <button class="filter-chip" onclick="applyFilter('filter-vivid', this)">Vivid</button>
        <button class="filter-chip" onclick="applyFilter('filter-soft', this)">Soft</button>
      </div>

      <!-- MODE SELECTOR: PHOTO / VIDEO -->
      <div class="mode-selector">
        <button class="mode-btn" id="mode-photo" onclick="setCaptureMode('photo')">Photo</button>
        <button class="mode-btn active" id="mode-video" onclick="setCaptureMode('video')">Video</button>
      </div>

      <div class="record-controls">
        <button class="upload-gallery-btn" onclick="openGalleryDirectly()">📁 Upload</button>
        <button id="record-trigger" class="record-trigger-btn" onclick="handleShutterClick()">
          <div class="record-trigger-btn-inner"></div>
        </button>
        <div style="width: 75px;"></div>
      </div>
    </div>
  </div>

  <script>
    let cameraStream = null;
    let isRecording = false;
    let currentFacingMode = 'user';
    let captureMode = 'video'; // 'video' or 'photo'
    let activeFilterClass = 'filter-none';

    function toggleVideoPlayback(container) {
      const video = container.querySelector('video');
      if (!video) return;
      video.paused ? video.play() : video.pause();
    }

    function handleReelScroll() {
      const feed = document.getElementById('reels-feed');
      const cards = feed.querySelectorAll('.reel-card');
      const scrollTop = feed.scrollTop;
      const height = feed.clientHeight;

      cards.forEach((card) => {
        const video = card.querySelector('video');
        if (Math.abs(card.offsetTop - scrollTop) < height / 2) {
          if (video && video.paused) {
            video.currentTime = 0;
            video.play().catch(() => {});
          }
        } else {
          if (video && !video.paused) video.pause();
        }
      });
    }

    async function startCamera(facingMode = 'user') {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: facingMode }, 
            audio: true 
          });
          const cameraPreview = document.getElementById('camera-stream');
          if (cameraPreview) cameraPreview.srcObject = cameraStream;
        } catch (err) {
          console.warn("Camera permission ungranted or unavailable.", err);
        }
      }
    }

    function applyFilter(filterClass, element) {
      activeFilterClass = filterClass;
      const cameraPreview = document.getElementById('camera-stream');
      if (cameraPreview) {
        cameraPreview.className = filterClass;
      }
      document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
      element.classList.add('active');
    }

    function setCaptureMode(mode) {
      captureMode = mode;
      const shutterBtn = document.getElementById('record-trigger');
      const photoBtn = document.getElementById('mode-photo');
      const videoBtn = document.getElementById('mode-video');

      if (mode === 'photo') {
        photoBtn.classList.add('active');
        videoBtn.classList.remove('active');
        shutterBtn.classList.add('photo-mode');
      } else {
        videoBtn.classList.add('active');
        photoBtn.classList.remove('active');
        shutterBtn.classList.remove('photo-mode');
      }
    }

    function handleShutterClick() {
      if (captureMode === 'photo') {
        takePhotoSnapshot();
      } else {
        toggleRecording();
      }
    }

    function takePhotoSnapshot() {
      const video = document.getElementById('camera-stream');
      if (!video) return;

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 720;
      canvas.height = video.videoHeight || 1280;
      const ctx = canvas.getContext('2d');

      // Apply current CSS filter to canvas context if needed
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageUrl = canvas.toDataURL('image/jpeg');

      postMediaToFeed(imageUrl, 'image');
    }

    async function openCreateModal() {
      const modal = document.getElementById('create-modal');
      if (modal) modal.classList.add('active');

      document.querySelectorAll('video').forEach(v => v.pause());
      await startCamera(currentFacingMode);
    }

    async function switchCamera() {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      await startCamera(currentFacingMode);
    }

    function closeCreateModal() {
      const modal = document.getElementById('create-modal');
      if (modal) modal.classList.remove('active');

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      handleReelScroll();
    }

    function toggleRecording() {
      const btn = document.getElementById('record-trigger');
      isRecording = !isRecording;
      btn.classList.toggle('recording', isRecording);
    }

    function openGalleryDirectly() {
      const galleryInput = document.getElementById('direct-gallery-input');
      if (galleryInput) galleryInput.click();
    }

    function handleDirectVideoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const mediaUrl = URL.createObjectURL(file);
      const type = file.type.startsWith('image/') ? 'image' : 'video';
      postMediaToFeed(mediaUrl, type);
      event.target.value = '';
    }

    function postMediaToFeed(srcUrl, type) {
      const feed = document.getElementById('reels-feed');
      const newReel = document.createElement('div');
      newReel.className = 'reel-card';

      const mediaHtml = (type === 'image') 
        ? `<img src="${srcUrl}" class="feed-photo ${activeFilterClass}" alt="User Photo" />`
        : `<video src="${srcUrl}" class="${activeFilterClass}" playsinline loop autoplay preload="metadata"></video>`;

      newReel.innerHTML = `
        <div class="reel-video-container" onclick="${type === 'video' ? 'toggleVideoPlayback(this)' : ''}">
          ${mediaHtml}
        </div>
        <div class="reel-overlay">
          <div class="reel-info">
            <div class="creator">@you</div>
            <div class="caption">New post 🔥</div>
          </div>
          <div class="reel-actions">
            <button class="action-btn-vertical" onclick="this.classList.toggle('liked')">
              <div class="action-icon-circle">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              </div>
              <span>0</span>
            </button>
            <button class="action-btn-vertical">
              <div class="action-icon-circle">
