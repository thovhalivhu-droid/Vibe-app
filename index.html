<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VIBE – Reels Feed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; height: 100vh; }
    
    .app { max-width: 430px; margin: auto; height: 100vh; position: relative; background: #0c0d12; overflow: hidden; display: flex; flex-direction: column; }
    
    header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: absolute; top: 0; left: 0; width: 100%; z-index: 50; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
    .logo { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #fff; }
    .header-controls { display: flex; align-items: center; gap: 8px; }
    .global-mute-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; backdrop-filter: blur(8px); font-weight: bold; }
    .badge { background: rgba(255,255,255,0.15); padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; backdrop-filter: blur(8px); }
    
    .view-section { height: calc(100vh - 65px); width: 100%; position: absolute; top: 0; left: 0; display: none; }
    .view-section.active { display: block; }

    /* REELS FEED (VERTICAL SWIPE) */
    .reels-feed { height: 100%; width: 100%; overflow-y: scroll; snap-type: y mandatory; scrollbar-width: none; }
    .reels-feed::-webkit-scrollbar { display: none; }

    .reel-card { height: 100%; width: 100%; snap-align: start; snap-stop: always; position: relative; background: #000; }
    .reel-video-container { width: 100%; height: 100%; position: relative; cursor: pointer; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* UNMUTE OVERLAY */
    .unmute-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      z-index: 20;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.2);
      transition: opacity 0.3s ease;
    }
    .unmute-overlay.hidden { opacity: 0; }

    /* REEL OVERLAY */
    .reel-overlay {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    .reel-info { flex: 1; padding-right: 16px; pointer-events: auto; }
    .creator { font-weight: 800; font-size: 15px; margin-bottom: 6px; color: #fff; }
    .caption { font-size: 13px; color: #eee; line-height: 1.4; }

    .reel-actions { display: flex; flex-direction: column; align-items: center; gap: 16px; pointer-events: auto; }
    .action-btn-vertical { background: none; border: none; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; }
    .action-icon { width: 42px; height: 42px; border-radius: 50%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; font-size: 20px; }

    /* BOTTOM NAV */
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: 65px; background: #0c0d12; border-top: 1px solid rgba(255,255,255,0.1); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; z-index: 100; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8e8e93; font-size: 10px; font-weight: 500; cursor: pointer; border: none; background: none; gap: 3px; }
    .nav-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
    .nav-btn.active { color: #ff4d79; }
    .nav-btn.active svg { stroke: #ff4d79; }

    .create-btn-wrapper { display: flex; justify-content: center; align-items: center; }
    .create-btn { width: 46px; height: 30px; background: #00f2fe; border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; box-shadow: -3px 0 0 #ff0050, 3px 0 0 #00f2fe; }
    .create-btn-inner { width: 100%; height: 100%; background: #ffffff; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .create-btn-inner svg { width: 16px; height: 16px; stroke: #000; stroke-width: 3; }
  </style>
</head>
<body>

  <div class="app">
    <header>
      <div class="logo">VIBE</div>
      <div class="header-controls">
        <button id="global-mute-btn" class="global-mute-btn" onclick="toggleGlobalMute()">🔇 Sound Off</button>
        <div class="badge">🇿🇦 SA Reels</div>
      </div>
    </header>

    <div id="home-view" class="view-section active">
      <div class="reels-feed" id="reels-feed" onscroll="handleReelScroll()">
        
        <!-- REEL 1 -->
        <div class="reel-card">
          <div class="reel-video-container" onclick="handleUserInteraction(this)">
            <video class="feed-video" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" playsinline loop autoplay muted></video>
            <div class="unmute-overlay">🔊 Tap screen for sound</div>
          </div>
          <div class="reel-overlay">
            <div class="reel-info">
              <div class="creator">@rafter6</div>
              <div class="caption">Everybody says stay motivated... I need my bank balance motivated first 😂</div>
            </div>
            <div class="reel-actions">
              <button class="action-btn-vertical"><div class="action-icon">❤️</div><span>128</span></button>
              <button class="action-btn-vertical"><div class="action-icon">💬</div><span>24</span></button>
              <button class="action-btn-vertical"><div class="action-icon">⋮</div><span>More</span></button>
            </div>
          </div>
        </div>

        <!-- REEL 2 -->
        <div class="reel-card">
          <div class="reel-video-container" onclick="handleUserInteraction(this)">
            <video class="feed-video" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" playsinline loop muted></video>
            <div class="unmute-overlay">🔊 Tap screen for sound</div>
          </div>
          <div class="reel-overlay">
            <div class="reel-info">
              <div class="creator">@vibe_creator</div>
              <div class="caption">New creator? Post it. Someone might discover you today 🔥</div>
            </div>
            <div class="reel-actions">
              <button class="action-btn-vertical"><div class="action-icon">❤️</div><span>76</span></button>
              <button class="action-btn-vertical"><div class="action-icon">💬</div><span>9</span></button>
              <button class="action-btn-vertical"><div class="action-icon">⋮</div><span>More</span></button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-btn active">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Reels</span>
      </button>
      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Discover</span>
      </button>
      <div class="create-btn-wrapper">
        <button class="create-btn">
          <div class="create-btn-inner">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </div>
        </button>
      </div>
      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg>
        <span>Alerts</span>
      </button>
      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script>
    let isGlobalMuted = true;

    // Handles playing ONLY the video visible on screen and pausing all others
    function handleReelScroll() {
      const feed = document.getElementById('reels-feed');
      const cards = feed.querySelectorAll('.reel-card');
      const scrollTop = feed.scrollTop;
      const height = feed.clientHeight;

      cards.forEach((card) => {
        const video = card.querySelector('video');
        if (!video) return;

        // Check if this card is currently in view
        const isVisible = Math.abs(card.offsetTop - scrollTop) < height / 2;

        if (isVisible) {
          video.muted = isGlobalMuted;
          video.play().catch(() => {});
        } else {
          // Pause and reset time for non-visible videos
          video.pause();
        }
      });
    }

    function handleUserInteraction(container) {
      const video = container.querySelector('video');
      const overlay = container.querySelector('.unmute-overlay');
      
      if (isGlobalMuted) {
        isGlobalMuted = false;
        document.querySelectorAll('.feed-video').forEach(v => { v.muted = false; });
        document.getElementById('global-mute-btn').textContent = '🔊 Sound On';
        document.querySelectorAll('.unmute-overlay').forEach(el => el.classList.add('hidden'));
      } else {
        if (video.paused) {
          video.play();
        } else {
          video.pause();
        }
      }
    }

    function toggleGlobalMute() {
      isGlobalMuted = !isGlobalMuted;
      document.querySelectorAll('.feed-video').forEach(v => { v.muted = isGlobalMuted; });
      document.getElementById('global-mute-btn').textContent = isGlobalMuted ? '🔇 Sound Off' : '🔊 Sound On';
      
      if (!isGlobalMuted) {
        document.querySelectorAll('.unmute-overlay').forEach(el => el.classList.add('hidden'));
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      handleReelScroll();
    });
  </script>
</body>
</html>
