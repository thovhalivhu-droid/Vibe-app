<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#000;
    color:white;
    height:100vh;
    overflow:hidden;
}

#app{
    width:100%;
    max-width:480px;
    height:100vh;
    margin:auto;
    background:#0f1015;
    position:relative;
    overflow:hidden;
}

/* HEADER */
header{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:60px;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:linear-gradient(#000c,transparent);
}

.logo{
    font-size:25px;
    font-weight:900;
    background:linear-gradient(45deg,#ff2a5f,#00f2fe);
    -webkit-background-clip:text;
    color:transparent;
}

.tabs{
    display:flex;
    gap:22px;
    font-weight:bold;
}

.tab{
    color:#888;
    cursor:pointer;
}

.tab.active{
    color:white;
}

.tab.active:after{
    content:"";
    display:block;
    width:22px;
    height:3px;
    background:#ff2a5f;
    border-radius:5px;
    margin:5px auto 0;
}

/* FEED */
#feed{
    height:100vh;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
}

#feed::-webkit-scrollbar{
    display:none;
}

.post{
    height:100vh;
    position:relative;
    scroll-snap-align:start;
    background:#000;
    overflow:hidden;
}

.post-media{
    width:100%;
    height:100%;
    object-fit:cover;
}

.post-info{
    position:absolute;
    left:15px;
    right:85px;
    bottom:80px;
    z-index:5;
    text-shadow:0 2px 5px #000;
}

.username{
    font-weight:bold;
    font-size:17px;
    margin-bottom:8px;
}

.caption{
    font-size:14px;
    line-height:1.4;
    margin-bottom:8px;
}

.audio{
    font-size:12px;
    color:#ddd;
}

.actions{
    position:absolute;
    right:12px;
    bottom:95px;
    display:flex;
    flex-direction:column;
    gap:18px;
    z-index:8;
}

.action{
    background:none;
    border:0;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    font-size:12px;
}

.action-icon{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#ffffff25;
    backdrop-filter:blur(8px);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    margin-bottom:3px;
}

.muted{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#000b;
    border-radius:50%;
    width:60px;
    height:60px;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:25px;
    z-index:10;
}

.muted.show{
    display:flex;
}

/* NAV */
nav{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#111d;
    backdrop-filter:blur(15px);
    border-top:1px solid #ffffff15;
    z-index:30;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nav-btn{
    background:none;
    border:0;
    color:#aaa;
    font-size:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
}

.nav-btn.active{
    color:white;
}

.create{
    width:44px;
    height:32px;
    border-radius:9px;
    background:linear-gradient(135deg,#ff2a5f,#00f2fe);
    color:white;
    font-size:24px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* CREATE SCREEN */
#createScreen{
    position:absolute;
    inset:0;
    background:#111218;
    z-index:50;
    display:none;
    flex-direction:column;
}

# createScreen.open{
    display:flex;
}

.create-header{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid #ffffff15;
}

.close{
    background:none;
    border:0;
    color:white;
    font-size:25px;
}

.create-content{
    padding:25px 20px;
    overflow-y:auto;
}

.create-title{
    font-size:25px;
    font-weight:bold;
    margin-bottom:25px;
}

.upload-box{
    border:2px dashed #555;
    border-radius:18px;
    padding:35px 20px;
    text-align:center;
    margin-bottom:20px;
}

.upload-icon{
    font-size:45px;
    margin-bottom:12px;
}

.upload-btn{
    display:inline-block;
    margin-top:15px;
    background:#ff2a5f;
    padding:12px 25px;
    border-radius:25px;
    font-weight:bold;
}

input[type=file]{
    display:none;
}

.preview{
    width:100%;
    max-height:400px;
    object-fit:contain;
    border-radius:15px;
    background:#000;
    display:none;
    margin-bottom:15px;
}

textarea{
    width:100%;
    height:100px;
    background:#1c1d25;
    border:1px solid #333;
    color:white;
    border-radius:12px;
    padding:14px;
    resize:none;
    font-size:15px;
    margin-bottom:15px;
}

.post-btn{
    width:100%;
    border:0;
    background:linear-gradient(135deg,#ff2a5f,#00cfe8);
    color:white;
    padding:15px;
    border-radius:25px;
    font-size:16px;
    font-weight:bold;
}

.post-btn:disabled{
    opacity:.4;
}

/* TOAST */
#toast{
    position:absolute;
    top:75px;
    left:50%;
    transform:translateX(-50%);
    background:#000d;
    padding:10px 18px;
    border-radius:20px;
    z-index:100;
    display:none;
    font-size:13px;
}
</style>
</head>

<body>

<div id="app">

<header>
    <div class="logo">VIBE</div>

    <div class="tabs">
        <div class="tab active">Following</div>
        <div class="tab">For You</div>
    </div>

    <div></div>
</header>

<main id="feed"></main>

<nav>
    <button class="nav-btn active" onclick="goHome()">
        🏠
        <span>Home</span>
    </button>

    <button class="nav-btn">
        🔎
        <span>Discover</span>
    </button>

    <button class="nav-btn" onclick="openCreate()">
        <div class="create">+</div>
    </button>

    <button class="nav-btn">
        💬
        <span>Inbox</span>
    </button>

    <button class="nav-btn">
        👤
        <span>Me</span>
    </button>
</nav>


<!-- CREATE SCREEN -->

<div id="createScreen">

    <div class="create-header">
        <button class="close" onclick="closeCreate()">✕</button>

        <strong>Create Post</strong>

        <div style="width:25px"></div>
    </div>

    <div class="create-content">

        <div class="create-title">
            Create your VIBE 🎬
        </div>

        <div class="upload-box">

            <div class="upload-icon">📸</div>

            <div>
                Choose a video or picture
            </div>

            <label class="upload-btn">
                Select Media
                <input
                    type="file"
                    id="mediaInput"
                    accept="image/*,video/*"
                >
            </label>

        </div>

        <video
            id="videoPreview"
            class="preview"
            controls
            playsinline
        ></video>

        <img
            id="imagePreview"
            class="preview"
        >

        <textarea
            id="captionInput"
            placeholder="Write a caption..."
        ></textarea>

        <button
            id="postButton"
            class="post-btn"
            disabled
            onclick="publishPost()"
        >
            Post to VIBE
        </button>

    </div>
</div>

<div id="toast"></div>

<script>

/* =========================
   VIBE DATA
========================= */

let posts = [
    {
        id:1,
        type:"video",
        src:"https://assets.mixkit.co/videos/preview/mixkit-woman-filming-herself-with-a-smartphone-41270-large.mp4",
        username:"@Elena",
        caption:"Golden hour vibes ✨",
        likes:24500
    },

    {
        id:2,
        type:"video",
        src:"https://assets.mixkit.co/videos/preview/mixkit-hands-typing-on-a-laptop-keyboard-close-up-42861-large.mp4",
        username:"@Liam",
        caption:"Late night coding session 💻⚡",
        likes:58100
    },

    {
        id:3,
        type:"video",
        src:"https://assets.mixkit.co/videos/preview/mixkit-cozy-living-room-with-a-fireplace-41153-large.mp4",
        username:"@Sophia",
        caption:"Weekend vibes 🏠✨",
        likes:12300
    }
];

let selectedFile = null;
let soundOn = true;


/* =========================
   FEED
========================= */

const feed = document.getElementById("feed");

function renderFeed(){

    feed.innerHTML = "";

    posts.forEach(post => {

        const card = document.createElement("div");

        card.className = "post";

        let media;

        if(post.type === "video"){

            media = document.createElement("video");

            media.src = post.src;
            media.className = "post-media";
            media.loop = true;
            media.playsInline = true;
            media.preload = "metadata";

            media.muted = !soundOn;

            /* TAP VIDEO = MUTE / UNMUTE */

            media.addEventListener("click", function(){

                soundOn = !soundOn;

                document.querySelectorAll(".post-media").forEach(v=>{
                    if(v.tagName === "VIDEO"){
                        v.muted = !soundOn;
                    }
                });

                showToast(soundOn ? "🔊 Sound ON" : "🔇 Sound OFF");

            });

        }else{

            media = document.createElement("img");

            media.src = post.src;
            media.className = "post-media";

        }


        card.appendChild(media);


        /* INFO */

        const info = document.createElement("div");

        info.className = "post-info";

        info.innerHTML = `
            <div class="username">${post.username}</div>

            <div class="caption">
                ${post.caption || ""}
            </div>

            <div class="audio">
                🎵 Original VIBE audio
            </div>
        `;

        card.appendChild(info);


        /* ACTIONS */

        const actions = document.createElement("div");

        actions.className = "actions";

        actions.innerHTML = `

            <button class="action"
                onclick="likePost(${post.id},this)">
                <div class="action-icon">❤️</div>
                <span>${formatNumber(post.likes)}</span>
            </button>

            <button class="action"
                onclick="showToast('💬 Comments coming soon')">
                <div class="action-icon">💬</div>
                <span>Comments</span>
            </button>

            <button class="action"
                onclick="sharePost()">
                <div class="action-icon">↗️</div>
                <span>Share</span>
            </button>

        `;

        card.appendChild(actions);

        feed.appendChild(card);

    });

    setupVideoObserver();
}


/* =========================
   VIDEO AUTO PLAY
========================= */

function setupVideoObserver(){

    const observer = new IntersectionObserver(
        entries => {

            entries.forEach(entry => {

                const video =
                    entry.target.querySelector("video");

                if(!video) return;

                if(entry.isIntersecting){

                    video.muted = !soundOn;

                    video.play().catch(()=>{});

                }else{

                    video.pause();

                }

            });

        },
        {
            root:feed,
            threshold:.65
        }
    );


    document
        .querySelectorAll(".post")
        .forEach(post=>{
            observer.observe(post);
        });
}


/* =========================
   NUMBER FORMAT
========================= */

function formatNumber(number){

    if(number >= 1000000)
        return (number/1000000).toFixed(1)+"M";

    if(number >= 1000)
        return (number/1000).toFixed(1)+"K";

    return number;
}


/* =========================
   LIKE
========================= */

function likePost(id,button){

    const post =
        posts.find(p=>p.id===id);

    if(!post) return;

    post.likes++;

    button.querySelector("span").innerText =
        formatNumber(post.likes);

    showToast("❤️ Liked");

}


/* =========================
   SHARE
========================= */

function sharePost(){

    if(navigator.share){

        navigator.share({
            title:"VIBE",
            text:"Check out this VIBE!"
        });

    }else{

        showToast("🔗 Share link copied");

    }

}


/* =========================
   CREATE SCREEN
========================= */

function openCreate(){

    document
        .getElementById("createScreen")
        .style.display="flex";

}


function closeCreate(){

    document
        .getElementById("createScreen")
        .style.display="none";

    selectedFile=null;

}


/* =========================
   SELECT IMAGE / VIDEO
========================= */

const mediaInput =
    document.getElementById("mediaInput");

mediaInput.addEventListener("change",function(){

    const file = this.files[0];

    if(!file) return;

    selectedFile=file;

    const url =
        URL.createObjectURL(file);

    const videoPreview =
        document.getElementById("videoPreview");

    const imagePreview =
        document.getElementById("imagePreview");


    videoPreview.style.display="none";
    imagePreview.style.display="none";


    if(file.type.startsWith("video/")){

        videoPreview.src=url;
        videoPreview.style.display="block";

    }

    else if(file.type.startsWith("image/")){

        imagePreview.src=url;
        imagePreview.style.display="block";

    }


    document
        .getElementById("postButton")
        .disabled=false;

});


/* =========================
   PUBLISH POST
========================= */

async function publishPost(){

    if(!selectedFile) return;

    const caption =
        document
        .getElementById("captionInput")
        .value.trim();


    const url =
        URL.createObjectURL(selectedFile);


    const newPost = {

        id:Date.now(),

        type:selectedFile.type.startsWith("video/")
            ? "video"
            : "image",

        src:url,

        username:"@You",

        caption:caption || "My new VIBE 🔥",

        likes:0

    };


    posts.unshift(newPost);

    renderFeed();

    closeCreate();

    document
        .getElementById("captionInput")
        .value="";

    mediaInput.value="";

    document
        .getElementById("postButton")
        .disabled=true;

    showToast("✅ Posted to VIBE!");

    feed.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   HOME
========================= */

function goHome(){

    document
        .getElementById("createScreen")
        .style.display="none";

    feed.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   TOAST
========================= */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.innerText=message;

    toast.style.display="block";

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{
        toast.style.display="none";
    },1800);

}


/* =========================
   START
========================= */

renderFeed();

</script>

</div>

</body>
    </html>
