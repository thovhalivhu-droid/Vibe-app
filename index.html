<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIBE – Reels Feed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
    
    .app { max-width: 430px; margin: auto; height: 100vh; position: relative; background: #0c0d12; overflow: hidden; }
    
    header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: absolute; top: 0; left: 0; width: 100%; z-index: 20; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); }
    .logo { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #fff; }
    .header-controls { display: flex; align-items: center; gap: 8px; }
    .global-mute-btn { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; backdrop-filter: blur(8px); }
    .badge { background: rgba(255,255,255,0.15); padding: 6px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; backdrop-filter: blur(8px); }
    
    .view-section { display: none; height: 100%; width: 100%; position: absolute; top: 0; left: 0; }
    .view-section.active { display: block; }

    /* REELS FEED (VERTICAL SWIPE) */
    .reels-feed { 
      height: 100vh; 
      width: 100%; 
      overflow-y: scroll; 
      snap-type: y mandatory; 
      scrollbar-width: none; 
    }
    .reels-feed::-webkit-scrollbar { display: none; }

    .reel-card { 
      height: 100vh; 
      width: 100%; 
      snap-align: start; 
      snap-stop: always; 
      position: relative; 
      background: #000; 
    }

    .reel-video-container { width: 100%; height: 100%; position: relative; cursor: pointer; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* FLOATING LIVE MOVING TIMED DURATION BADGE */
    .duration-badge {
      position: absolute;
      top: 68px;
      left: 16px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-variant-numeric: tabular-nums;
      backdrop-filter: blur(4px);
    }
    .duration-badge.visible { opacity: 1; }

    /* REEL OVERLAY CONTENT */
    .reel-overlay {
      position: absolute;
      bottom: 85px;
      left: 0;
      width: 100%;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    .reel-info { flex: 1; padding-right: 16px; pointer-events: auto; }
    .creator { font-weight: 800; font-size: 15px; margin-bottom: 6px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .caption { font-size: 13px; color: #eee; line-height: 1.4; white-space: pre-line; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

    /* RIGHT-SIDE FLOATING ACTIONS */
    .reel-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      pointer-events: auto;
    }

    .action-btn-vertical {
      background: none;
      border: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
    }
    .action-btn-vertical:active { transform: scale(0.9); }
    .action-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .action-btn-vertical.liked .action-icon { color: #ff4d79; }

    /* BOTTOM NAV BAR */
    .bottom-nav { 
      position: absolute; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      height: 70px; 
      background: rgba(12, 13, 18, 0.9); 
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.1); 
      display: grid; 
      grid-template-columns: repeat(5, 1fr); 
      align-items: center; 
      z-index: 100; 
    }

    .nav-btn { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      color: #8e8e93; 
      font-size: 10px; 
      font-weight: 500;
      cursor: pointer; 
      border: none; 
      background: none; 
      gap: 4px;
    }
    .nav-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-btn.active { color: #ff4d79; }
    .nav-btn.active svg { stroke: #ff4d79; }

    /* ENHANCED CREATE BUTTON */
    .create-btn-wrapper { display: flex; justify-content: center; align-items: center; }
    .create-btn { 
      width: 48px; 
      height: 32px; 
      background: #00f2fe; 
      border-radius: 10px; 
      position: relative; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      border: none; 
      cursor: pointer; 
      box-shadow: -3px 0 0 #ff0050, 3px 0 0 #00f2fe; 
      transition: transform 0.15s ease;
    }
    .create-btn:active { transform: scale(0.92); }
    .create-btn-inner { 
      width: 100%; 
      height: 100%; 
      background: #ffffff; 
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .create-btn-inner svg { width: 18px; height: 18px; stroke: #000; stroke-width: 2.8; }

    /* FULLSCREEN VIDEO CREATOR MODAL */
    .create-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 300;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px;
    }
    .create-modal.active { display: flex; }

    .creator-header { display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .close-modal-btn { background: rgba(0,0,0,0.5); border: none; color: #fff; font-size: 24px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }

    .camera-preview-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .camera-preview-container video { width: 100%; height: 100%; object-fit: cover; }

    .creator-bottom-controls {
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }

    .record-controls {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
    }

    .upload-gallery-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .record-trigger-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .record-trigger-btn-inner {
      width: 100%;
      height: 100%;
      background: #fe2c55;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }
    .record-trigger-btn.recording .record-trigger-btn-inner {
      transform: scale(0.6);
      border-radius: 8px;
    }

    /* MODALS GENERAL */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 200; justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #161722; width: 90%; max-width: 380px; padding: 20px; border-radius: 20px; border: 1px solid #232535; }
    .modal-content h3 { margin-top: 0; margin-bottom: 15px; text-align: center; }
    .menu-options-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .menu-option-btn { background: #0c0d12; border: 1px solid #232535; color: #fff; padding: 14px 16px; border-radius: 12px; font-size: 14px; text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
    .modal-btn { padding: 10px 18px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
    .btn-cancel { background: #232535; color: #ccc; }
  </style>
</head>
<body>

  <div class="app">
    <header>
      <div class="logo">VIBE</div>
      <div class="header-controls">
        <button id="global-mute-btn" class="global-mute-btn" onclick="toggleGlobalMute()">🔊 Sound On</button>
        <div class="badge">🇿🇦 SA Reels</div>
      </div>
    </header>

    <!-- HIDDEN GALLERY INPUT FOR DIRECT FILE SELECTION -->
    <input type="file" id="direct-gallery-input" accept="video/*" style="display: none;" onchange="handleDirectVideoSelect(event)" />

    <!-- HOME / REELS FEED -->
    <div id="home-view" class="view-section active">
      <div class="reels-feed" id="reels-feed" onscroll="handleReelScroll()">
        
        <div class="reel-card">
          <div class="reel-video-container" onclick="toggleVideoPlayback(this)">
            <video src="https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" playsinline loop preload="metadata" ontimeupdate="updateVideoTimeDisplay(this)"></video>
            <div class="duration-badge">0:00 / 0:00</div>
          </div>
          <div class="reel-overlay">
            <div class="reel-info">
              <div class="creator">@rafter6</div>
              <div class="caption">Everybody says stay motivated... I need my bank balance motivated first 😂</div>
            </div>
            <div class="reel-actions">
              <button class="action-btn-vertical" onclick="toggleLike(this, 128)">
                <div class="action-icon">❤️</div>
                <span class="like-count">128</span>
              </button>
              <button class="action-btn-vertical" onclick="openCommentModal(this)">
                <div class="action-icon">💬</div>
                <span class="comment-count">24</span>
              </button>
              <button class="action-btn-vertical" onclick="shareVideoActionFromBtn(this)">
                <div class="action-icon">📤</div>
                <span>Share</span>
              </button>
              <button class="action-btn-vertical" onclick="openVideoOptionsMenu(this)">
                <div class="action-icon">⋮</div>
                <span>More</span>
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="switchTab('home-view', this)">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Reels</span>
      </button>

      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Discover</span>
      </button>

      <!-- CREATE VIDEO BUTTON -->
      <div class="create-btn-wrapper">
        <button class="create-btn" onclick="openCreateModal()">
          <div class="create-btn-inner">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </div>
        </button>
      </div>

      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span>Alerts</span>
      </button>

      <button class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <!-- VIDEO CREATOR SCREEN MODAL -->
  <div id="create-modal" class="create-modal">
    <div class="creator-header">
      <button class="close-modal-btn" onclick="closeCreateModal()">✕</button>
      <div style="font-weight: bold; font-size: 15px;">Create Video</div>
      <div style="width: 40px;"></div>
    </div>

    <div class="camera-preview-container">
      <video id="camera-stream" autoplay playsinline muted></video>
    </div>

    <div class="creator-bottom-controls">
      <div class="record-controls">
        <button class="upload-gallery-btn" onclick="openGalleryDirectly()">📁 Upload</button>
        <button id="record-trigger" class="record-trigger-btn" onclick="toggleRecording()">
          <div class="record-trigger-btn-inner"></div>
        </button>
        <div style="width: 70px;"></div>
      </div>
    </div>
  </div>

  <script>
    let isGlobalMuted = false;
    let cameraStream = null;
    let isRecording = false;

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds === 0) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function updateVideoTimeDisplay(video) {
      const card = video.closest('.reel-card');
      if (!card) return;
      const badge = card.querySelector('.duration-badge');
      if (!badge) return;
      badge.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
    }

    function toggleVideoPlayback(container) {
      const video = container.querySelector('video');
      if (!video) return;
      video.paused ? video.play() : video.pause();
    }

    function handleReelScroll() {
      const feed = document.getElementById('reels-feed');
      const cards = feed.querySelectorAll('.reel-card');
      const scrollTop = feed.scrollTop;
      const height = feed.clientHeight;

      cards.forEach((card) => {
        const video = card.querySelector('video');
        if (Math.abs(card.offsetTop - scrollTop) < height / 2) {
          if (video && video.paused) {
            video.muted = isGlobalMuted;
            video.play().catch(() => {});
          }
        } else {
          if (video && !video.paused) video.pause();
        }
      });
    }

    /* OPEN & CLOSE CREATE VIDEO MODAL */
    async function openCreateModal() {
      document.getElementById('create-modal').classList.add('active');
      document.querySelectorAll('video').forEach(v => v.pause());

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const cameraPreview = document.getElementById('camera-stream');
        cameraPreview.srcObject = cameraStream;
      } catch (err) {
        console.log("Camera access disabled or unsupported.");
      }
    }

    function closeCreateModal() {
      document.getElementById('create-modal').classList.remove('active');
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      handleReelScroll();
    }

    function toggleRecording() {
      const btn = document.getElementById('record-trigger');
      isRecording = !isRecording;
      btn.classList.toggle('recording', isRecording);
    }

    function openGalleryDirectly() {
      document.getElementById('direct-gallery-input').click();
    }

    function handleDirectVideoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const videoUrl = URL.createObjectURL(file);
      const feed = document.getElementById('reels-feed');

      const newReel = document.createElement('div');
      newReel.className = 'reel-card';
      newReel.innerHTML = `
        <div class="reel-video-container" onclick="toggleVideoPlayback(this)">
          <video src="${videoUrl}" playsinline loop preload="metadata" ontimeupdate="updateVideoTimeDisplay(this)"></video>
          <div class="duration-badge">0:00 / 0:00</div>
        </div>
        <div class="reel-overlay">
          <div class="reel-info">
            <div class="creator">@you</div>
            <div class="caption">New video created 🔥</div>
          </div>
          <div class="reel-actions">
            <button class="action-btn-vertical"><div class="action-icon">❤️</div><span>0</span></button>
            <button class="action-btn-vertical"><div class="action-icon">💬</div><span>0</span></button>
            <button class="action-btn-vertical"><div class="action-icon">📤</div><span>Share</span></button>
            <button class="action-btn-vertical"><div class="action-icon">⋮</div><span>More</span></button>
          </div>
        </div>
      `;

      feed.prepend(newReel);
      closeCreateModal();
      feed.scrollTop = 0;
      handleReelScroll();
      event.target.value = '';
    }

    window.addEventListener('DOMContentLoaded', () => {
      handleReelScroll();
    });
  </script>
</body>
</html>
