<script>
    // =========================
    // VIBE FEED DATA
    // =========================
    const feedData = [
        {
            id: 1,
            author: "Elena Rostova",
            avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150",
            caption: "Golden hour tones hitting different today ✨ Sunset session in the city.",
            audio: "Original Audio - Elena",
            likes: "24.5K",
            comments: "412",
            shares: "1.2K",
            videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-woman-filming-herself-with-a-smartphone-41270-large.mp4"
        },
        {
            id: 2,
            author: "Liam Chen",
            avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150",
            caption: "Late night coding session workflow check 💻⚡ #vibe #setup",
            audio: "Lofi Chill Beats - SoundHelix",
            likes: "58.1K",
            comments: "930",
            shares: "4.5K",
            videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-hands-typing-on-a-laptop-keyboard-close-up-42861-large.mp4"
        },
        {
            id: 3,
            author: "Sophia Taylor",
            avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150",
            caption: "Weekend aesthetic inspirations. Clean interior architecture layout.",
            audio: "Ambient Space - Dreamscape",
            likes: "12.3K",
            comments: "154",
            shares: "890",
            videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-cozy-living-room-with-a-fireplace-41153-large.mp4"
        }
    ];

    const feedContainer = document.getElementById('feedContainer');
    const profileGrid = document.getElementById('profileGrid');

    let activeVideoElement = null;

    // =====================================================
    // SOUND SETTING
    // true = sound ON
    // false = muted
    // =====================================================
    let soundEnabled = false;


    // =========================
    // RENDER FEED
    // =========================
    function renderFeed() {

        feedContainer.innerHTML = '';

        feedData.forEach((item) => {

            const card = document.createElement('div');
            card.className = 'reel-card';

            card.innerHTML = `
                <video
                    class="reel-video"
                    src="${item.videoUrl}"
                    loop
                    playsinline
                    preload="auto"
                    muted
                ></video>

                <div class="reel-overlay">

                    <div class="reel-info">

                        <div class="reel-author">
                            <img
                                src="${item.avatar}"
                                class="author-avatar"
                            >

                            <span class="author-name">
                                ${item.author}
                            </span>

                            <button
                                class="follow-btn"
                                onclick="toggleFollow(this)"
                            >
                                Follow
                            </button>
                        </div>

                        <div class="reel-caption">
                            ${item.caption}
                        </div>

                        <div class="reel-audio-tag">
                            <svg
                                width="12"
                                height="12"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path d="M9 18V5l12-2v13"></path>
                                <circle cx="6" cy="18" r="3"></circle>
                                <circle cx="18" cy="16" r="3"></circle>
                            </svg>

                            <span>${item.audio}</span>
                        </div>

                    </div>


                    <div class="reel-actions">

                        <!-- LIKE -->
                        <button
                            class="action-item"
                            onclick="handleLike(this)"
                        >
                            <div class="action-icon-box">

                                <svg
                                    width="22"
                                    height="22"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                                </svg>

                            </div>

                            <span class="action-count">
                                ${item.likes}
                            </span>
                        </button>


                        <!-- COMMENTS -->
                        <button
                            class="action-item"
                            onclick="showToast('Comments opened')"
                        >
                            <div class="action-icon-box">

                                <svg
                                    width="22"
                                    height="22"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                </svg>

                            </div>

                            <span class="action-count">
                                ${item.comments}
                            </span>
                        </button>


                        <!-- SHARE -->
                        <button
                            class="action-item"
                            onclick="showToast('Link copied to clipboard!')"
                        >
                            <div class="action-icon-box">

                                <svg
                                    width="22"
                                    height="22"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <circle cx="18" cy="5" r="3"></circle>
                                    <circle cx="6" cy="12" r="3"></circle>
                                    <circle cx="18" cy="19" r="3"></circle>
                                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                                </svg>

                            </div>

                            <span class="action-count">
                                ${item.shares}
                            </span>
                        </button>

                    </div>

                </div>
            `;

            feedContainer.appendChild(card);
        });


        // =========================
        // PROFILE GRID
        // =========================
        profileGrid.innerHTML = '';

        feedData.forEach(item => {

            const gridItem = document.createElement('div');

            gridItem.className = 'grid-item';

            gridItem.innerHTML = `
                <video
                    src="${item.videoUrl}"
                    muted
                    playsinline
                ></video>
            `;

            profileGrid.appendChild(gridItem);
        });


        setupVideoControls();
        setupIntersectionObserver();
    }


    // =====================================================
    // AUTO PLAY / PAUSE
    // =====================================================
    function setupIntersectionObserver() {

        const observerOptions = {
            root: feedContainer,
            threshold: 0.65
        };


        const observer = new IntersectionObserver(
            (entries) => {

                entries.forEach(entry => {

                    const video =
                        entry.target.querySelector('.reel-video');

                    if (!video) return;


                    if (entry.isIntersecting) {

                        // Keep sound setting
                        video.muted = !soundEnabled;

                        video.play().catch(() => {});

                        activeVideoElement = video;

                    } else {

                        video.pause();

                    }

                });

            },
            observerOptions
        );


        document
            .querySelectorAll('.reel-card')
            .forEach(card => {

                observer.observe(card);

            });
    }


    // =====================================================
    // TAP VIDEO = MUTE / UNMUTE
    // =====================================================
    function setupVideoControls() {

        document
            .querySelectorAll('.reel-video')
            .forEach(video => {

                let lastTap = 0;


                video.addEventListener('click', function(event) {

                    const currentTime =
                        new Date().getTime();

                    const tapLength =
                        currentTime - lastTap;


                    // Double tap is handled separately
                    if (
                        tapLength < 300 &&
                        tapLength > 0
                    ) {

                        lastTap = 0;

                        handleDoubleTapLike(this);

                        return;
                    }


                    lastTap = currentTime;


                    // Wait slightly before deciding
                    // it is a single tap
                    setTimeout(() => {

                        if (
                            new Date().getTime() -
                            lastTap >= 300
                        ) {

                            toggleSound(this);

                        }

                    }, 310);

                });

            });
    }


    // =====================================================
    // SOUND TOGGLE
    // =====================================================
    function toggleSound(video) {

        soundEnabled = !soundEnabled;


        document
            .querySelectorAll('.reel-video')
            .forEach(v => {

                v.muted = !soundEnabled;

            });


        if (soundEnabled) {

            showToast("🔊 Sound ON");

        } else {

            showToast("🔇 Sound OFF");

        }
    }


    // =====================================================
    // DOUBLE TAP = LIKE
    // =====================================================
    function handleDoubleTapLike(video) {

        const card = video.closest('.reel-card');

        if (!card) return;


        const likeButton =
            card.querySelector('.action-item');

        if (!likeButton) return;


        // Only like if not already liked
        if (!likeButton.classList.contains('liked')) {

            handleLike(likeButton);

        }


        // Heart animation
        const heart = document.createElement('div');

        heart.innerHTML = '❤️';

        heart.style.position = 'absolute';
        heart.style.left = '50%';
        heart.style.top = '50%';
        heart.style.transform =
            'translate(-50%, -50%) scale(0.5)';
        heart.style.fontSize = '90px';
        heart.style.zIndex = '50';
        heart.style.pointerEvents = 'none';
        heart.style.transition =
            'transform 0.35s ease, opacity 0.35s ease';
        heart.style.opacity = '1';


        card.appendChild(heart);


        requestAnimationFrame(() => {

            heart.style.transform =
                'translate(-50%, -50%) scale(1.2)';

        });


        setTimeout(() => {

            heart.style.transform =
                'translate(-50%, -50%) scale(1.5)';

            heart.style.opacity = '0';

        }, 200);


        setTimeout(() => {

            heart.remove();

        }, 550);
    }


    // =====================================================
    // LIKE BUTTON
    // =====================================================
    function handleLike(btn) {

        btn.classList.toggle('liked');


        if (btn.classList.contains('liked')) {

            showToast('❤️ Added to liked reels');

        } else {

            showToast('Unliked');

        }
    }


    // =====================================================
    // FOLLOW
    // =====================================================
    function toggleFollow(btn) {

        if (btn.innerText === "Follow") {

            btn.innerText = "Following";

            btn.style.background =
                "var(--surface-color)";

            btn.style.color =
                "var(--text-muted)";

            showToast("Following user");

        } else {

            btn.innerText = "Follow";

            btn.style.background =
                "var(--primary-color)";

            btn.style.color = "#fff";

            showToast("Unfollowed");
        }
    }


    // =====================================================
    // TOAST
    // =====================================================
    function showToast(msg) {

        const toast =
            document.getElementById('toast');

        toast.innerText = msg;

        toast.classList.add('show');


        setTimeout(() => {

            toast.classList.remove('show');

        }, 2000);
    }


    // =====================================================
    // SWIPE UP / DOWN
    // =====================================================

    let touchStartY = 0;
    let touchEndY = 0;

    feedContainer.addEventListener(
        'touchstart',
        (event) => {

            touchStartY =
                event.touches[0].clientY;

        },
        { passive: true }
    );


    feedContainer.addEventListener(
        'touchend',
        (event) => {

            touchEndY =
                event.changedTouches[0].clientY;

            handleSwipe();

        },
        { passive: true }
    );


    function handleSwipe() {

        const difference =
            touchStartY - touchEndY;


        const minimumSwipe = 50;


        // Swipe UP
        if (difference > minimumSwipe) {

            goToNextReel();

        }


        // Swipe DOWN
        else if (difference < -minimumSwipe) {

            goToPreviousReel();

        }
    }


    // =====================================================
    // NEXT REEL
    // =====================================================
    function goToNextReel() {

        const cards =
            [...document.querySelectorAll('.reel-card')];

        if (!cards.length) return;


        const current =
            getCurrentReelIndex(cards);


        const nextIndex =
            Math.min(current + 1, cards.length - 1);


        cards[nextIndex].scrollIntoView({
            behavior: 'smooth',
            block: 'start'
        });
    }


    // =====================================================
    // PREVIOUS REEL
    // =====================================================
    function goToPreviousReel() {

        const cards =
            [...document.querySelectorAll('.reel-card')];

        if (!cards.length) return;


        const current =
            getCurrentReelIndex(cards);


        const previousIndex =
            Math.max(current - 1, 0);


        cards[previousIndex].scrollIntoView({
            behavior: 'smooth',
            block: 'start'
        });
    }


    // =====================================================
    // FIND CURRENT REEL
    // =====================================================
    function getCurrentReelIndex(cards) {

        const containerTop =
            feedContainer.getBoundingClientRect().top;


        let closestIndex = 0;
        let closestDistance = Infinity;


        cards.forEach((card, index) => {

            const distance =
                Math.abs(
                    card.getBoundingClientRect().top -
                    containerTop
                );


            if (distance < closestDistance) {

                closestDistance = distance;
                closestIndex = index;

            }

        });


        return closestIndex;
    }


    // =====================================================
    // NAVIGATION
    // =====================================================
    const navItems =
        document.querySelectorAll('.nav-item');

    const studioScreen =
        document.getElementById('studio-screen');

    const inboxScreen =
        document.getElementById('inbox-screen');

    const profileScreen =
        document.getElementById('profile-screen');


    navItems.forEach(item => {

        item.addEventListener('click', () => {

            const tab =
                item.getAttribute('data-tab');


            navItems.forEach(n =>
                n.classList.remove('active')
            );


            if (
                tab === 'home' ||
                tab === 'discover'
            ) {

                item.classList.add('active');

                studioScreen.classList.remove('open');

                inboxScreen.classList.remove('open');

                profileScreen.classList.remove('open');

            }


            else if (tab === 'create') {

                studioScreen.classList.add('open');

                startCamera();

            }


            else if (tab === 'inbox') {

                item.classList.add('active');

                inboxScreen.classList.add('open');

            }


            else if (tab === 'profile') {

                item.classList.add('active');

                profileScreen.classList.add('open');

            }

        });

    });


    // =====================================================
    // CLOSE STUDIO
    // =====================================================
    document
        .getElementById('closeStudio')
        .addEventListener('click', () => {

            studioScreen.classList.remove('open');

            stopCamera();

        });


    // =====================================================
    // CLOSE OTHER SCREENS
    // =====================================================
    document
        .querySelectorAll('[data-close]')
        .forEach(btn => {

            btn.addEventListener('click', (e) => {

                const target =
                    e.target.getAttribute('data-close');


                if (target === 'inbox') {

                    inboxScreen.classList.remove('open');

                }


                if (target === 'profile') {

                    profileScreen.classList.remove('open');

                }

            });

        });


    // =====================================================
    // CAMERA
    // =====================================================
    let mediaStream = null;

    const cameraPreview =
        document.getElementById('camera-preview');


    async function startCamera() {

        try {

            mediaStream =
                await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user'
                    },
                    audio: true
                });


            cameraPreview.srcObject =
                mediaStream;

        }

        catch (err) {

            showToast(
                "Camera access unavailable, sample mode active"
            );

        }
    }


    function stopCamera() {

        if (mediaStream) {

            mediaStream
                .getTracks()
                .forEach(track =>
                    track.stop()
                );

            mediaStream = null;

        }
    }


    // =====================================================
    // FILTERS
    // =====================================================
    document
        .querySelectorAll('.filter-pill')
        .forEach(pill => {

            pill.addEventListener('click', (e) => {

                document
                    .querySelectorAll('.filter-pill')
                    .forEach(p =>
                        p.classList.remove('active')
                    );


                e.target.classList.add('active');


                const filterVal =
                    e.target.getAttribute(
                        'data-filter'
                    );


                cameraPreview.style.filter =
                    filterVal === 'none'
                        ? ''
                        : filterVal;

            });

        });


    // =====================================================
    // RECORDING
    // =====================================================
    const shutterBtn =
        document.getElementById('shutterBtn');

    let isRecording = false;


    shutterBtn.addEventListener('click', () => {

        isRecording = !isRecording;


        if (isRecording) {

            shutterBtn.classList.add('recording');

            showToast("Recording started...");

        } else {

            shutterBtn.classList.remove('recording');

            showToast("Recording saved successfully!");


            setTimeout(() => {

                studioScreen.classList.remove('open');

                stopCamera();

            }, 1000);

        }

    });


    // =====================================================
    // INITIALIZE
    // =====================================================
    renderFeed();


    // Start first video automatically
    setTimeout(() => {

        const firstVideo =
            document.querySelector('.reel-video');

        if (firstVideo) {

            firstVideo.muted =
                !soundEnabled;

            firstVideo.play().catch(() => {});

            activeVideoElement =
                firstVideo;

        }

    }, 300);

</script>
