<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reels App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* App Container (Mobile Frame) */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 850px;
            background: #121212;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @media (min-width: 421px) {
            .app-container {
                border-radius: 24px;
                border: 8px solid #222;
            }
        }

        /* Top Header */
        .app-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
        }

        .app-header h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Reels Feed Container */
        .reels-feed {
            flex: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; /* Firefox */
        }

        .reels-feed::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        /* Individual Reel Item */
        .reel-item {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .reel-media-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
        }

        .reel-media-container img, 
        .reel-media-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Floating Heart Animation */
        .floating-heart {
            position: absolute;
            font-size: 90px;
            color: #ff3b5c;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: popAndFade 0.8s ease-out forwards;
            z-index: 20;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        @keyframes popAndFade {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(-15deg);
                opacity: 0;
            }
            30% {
                transform: translate(-50%, -50%) scale(1.3) rotate(10deg);
                opacity: 1;
            }
            60% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.4) translateY(-50px) rotate(0deg);
                opacity: 0;
            }
        }

        /* Reel Overlay Info */
        .reel-overlay {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 80px;
            z-index: 5;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }

        .reel-author {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 6px;
        }

        .reel-caption {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.3;
        }

        /* Action Sidebar */
        .reel-actions {
            position: absolute;
            bottom: 20px;
            right: 12px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            font-size: 12px;
            gap: 4px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            transition: transform 0.1s ease;
        }

        .action-btn:active {
            transform: scale(0.9);
        }

        .action-btn svg {
            width: 30px;
            height: 30px;
            fill: #fff;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
        }

        .action-btn.liked svg {
            fill: #ff3b5c;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            height: 60px;
            background: #121212;
            border-top: 1px solid #262626;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .nav-item {
            background: none;
            border: none;
            color: #8e8e8e;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #fff;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Header -->
        <header class="app-header">
            <h1>Reels</h1>
        </header>

        <!-- Main Feed -->
        <div class="reels-feed" id="reelsFeed">
            <!-- Reels will be dynamically injected here via JS -->
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                Discover
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                Create
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                Activity
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                Profile
            </button>
        </nav>
    </div>

    <script>
        // Sample Mock Reels Data
        const reelsData = [
            {
                id: 1,
                author: "@creative_mind",
                caption: "Exploring cinematic aesthetics and morning lighting. ✨ #photography #vibes",
                mediaUrl: "https://images.unsplash.com/photo-1682687220063-4742bd7fd538?w=800&auto=format&fit=crop&q=60",
                isVideo: false,
                likes: 1243,
                isLiked: false
            },
            {
                id: 2,
                author: "@urban_explorer",
                caption: "Concrete jungles look completely different after sunset. 🏙️",
                mediaUrl: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop&q=60",
                isVideo: false,
                likes: 4520,
                isLiked: false
            },
            {
                id: 3,
                author: "@nature_daily",
                caption: "Peaceful escape into the wild. Turn sound up 🔊🌿",
                mediaUrl: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&auto=format&fit=crop&q=60",
                isVideo: false,
                likes: 890,
                isLiked: false
            }
        ];

        const feedContainer = document.getElementById('reelsFeed');

        // Render Reels
        function renderReels() {
            feedContainer.innerHTML = '';
            reelsData.forEach(reel => {
                const reelElement = document.createElement('div');
                reelElement.classList.add('reel-item');
                
                reelElement.innerHTML = `
                    <div class="reel-media-container">
                        <img src="${reel.mediaUrl}" alt="Reel media">
                    </div>
                    <div class="reel-overlay">
                        <div class="reel-author">${reel.author}</div>
                        <div class="reel-caption">${reel.caption}</div>
                    </div>
                    <div class="reel-actions">
                        <button class="action-btn like-btn ${reel.isLiked ? 'liked' : ''}">
                            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            <span class="like-count">${reel.likes}</span>
                        </button>
                        <button class="action-btn">
                            <svg viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg>
                            <span>142</span>
                        </button>
                        <button class="action-btn">
                            <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                            <span>Share</span>
                        </button>
                    </div>
                `;

                // Bind elements for actions
                const mediaContainer = reelElement.querySelector('.reel-media-container');
                const likeBtn = reelElement.querySelector('.like-btn');
                const likeCountSpan = reelElement.querySelector('.like-count');

                // Standard Click on Sidebar Like Button
                likeBtn.addEventListener('click', () => {
                    toggleLike(reel, likeBtn, likeCountSpan);
                });

                // Double Tap to Like Setup
                setupDoubleTapToLike(mediaContainer, reel, likeBtn, likeCountSpan);

                feedContainer.appendChild(reelElement);
            });
        }

        // Toggle Like State Logic
        function toggleLike(reel, likeBtn, likeCountSpan) {
            reel.isLiked = !reel.isLiked;
            if (reel.isLiked) {
                reel.likes += 1;
                likeBtn.classList.add('liked');
            } else {
                reel.likes -= 1;
                likeBtn.classList.remove('liked');
            }
            likeCountSpan.textContent = reel.likes;
        }

        // Double Tap Detector Handler
        function setupDoubleTapToLike(mediaContainer, reel, likeBtn, likeCountSpan) {
            let lastTapTime = 0;

            mediaContainer.addEventListener('click', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;

                // Threshold set to 300ms for double tap
                if (tapLength < 300 && tapLength > 0) {
                    e.preventDefault();

                    // Automatically like if not already liked
                    if (!reel.isLiked) {
                        toggleLike(reel, likeBtn, likeCountSpan);
                    }

                    // Trigger heart floating animation at cursor/tap coordinate
                    createFloatingHeart(mediaContainer, e);
                }
                lastTapTime = currentTime;
            });
        }

        // Create Animated Heart Element
        function createFloatingHeart(container, event) {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = '❤️';

            const rect = container.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            heart.style.left = `${x}px`;
            heart.style.top = `${y}px`;

            container.appendChild(heart);

            // Clean up element after animation finishes
            setTimeout(() => {
                heart.remove();
            }, 800);
        }

        // Initialize Feed on Load
        window.addEventListener('DOMContentLoaded', renderReels);
    </script>
</body>
</html>
