<script>
  let isGlobalMuted = true;
  let selectedMediaUrl = null;
  let selectedMediaType = null;

  // IntersectionObserver setup
  const observerOptions = {
    root: document.getElementById('reels-feed'),
    threshold: 0.6
  };

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target.querySelector('video');
      if (!video) return;

      if (entry.isIntersecting) {
        video.currentTime = 0;
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    });
  }, observerOptions);

  // SAFE INIT: Attach observer only after DOM is fully loaded
  window.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.reel-card').forEach(card => observer.observe(card));
  });

  function togglePlayPause(container) {
    const video = container.querySelector('video');
    if (!video) return;
    
    if (isGlobalMuted) {
      isGlobalMuted = false;
      document.querySelectorAll('.feed-video').forEach(v => { v.muted = false; });
      document.getElementById('global-mute-btn').textContent = '🔊 Sound On';
      document.querySelectorAll('.unmute-overlay').forEach(el => el.classList.add('hidden'));
    } else {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }
  }

  function toggleGlobalMute() {
    isGlobalMuted = !isGlobalMuted;
    document.querySelectorAll('.feed-video').forEach(v => { v.muted = isGlobalMuted; });
    document.getElementById('global-mute-btn').textContent = isGlobalMuted ? '🔇 Sound Off' : '🔊 Sound On';
    
    if (!isGlobalMuted) {
      document.querySelectorAll('.unmute-overlay').forEach(el => el.classList.add('hidden'));
    }
  }

  /* CREATE MODAL FUNCTIONS */
  function openCreateModal() {
    document.getElementById('create-modal').classList.add('active');
  }

  function closeCreateModal() {
    document.getElementById('create-modal').classList.remove('active');
  }

  function handleMediaSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    selectedMediaUrl = URL.createObjectURL(file);
    const videoPreview = document.getElementById('preview-video');
    const imgPreview = document.getElementById('preview-image');
    const placeholder = document.getElementById('upload-placeholder');

    placeholder.style.display = 'none';

    if (file.type.startsWith('video/')) {
      selectedMediaType = 'video';
      imgPreview.style.display = 'none';
      videoPreview.src = selectedMediaUrl;
      videoPreview.style.display = 'block';
    } else if (file.type.startsWith('image/')) {
      selectedMediaType = 'image';
      videoPreview.style.display = 'none';
      imgPreview.src = selectedMediaUrl;
      imgPreview.style.display = 'block';
    }
  }

  function publishReel() {
    const captionText = document.getElementById('reel-caption').value || "New Post!";
    const feed = document.getElementById('reels-feed');

    if (!selectedMediaUrl) {
      alert("Please record or select a video/photo first!");
      return;
    }

    const newCard = document.createElement('div');
    newCard.className = 'reel-card';

    if (selectedMediaType === 'video') {
      newCard.innerHTML = `
        <div class="reel-video-container" onclick="togglePlayPause(this)">
          <video class="feed-video" src="${selectedMediaUrl}" playsinline loop muted></video>
          <div class="unmute-overlay ${!isGlobalMuted ? 'hidden' : ''}">🔊 Tap screen for sound</div>
        </div>
        <div class="reel-overlay">
          <div class="reel-info">
            <div class="creator">@you</div>
            <div class="caption">${captionText}</div>
          </div>
          <div class="reel-actions">
            <button class="action-btn-vertical"><div class="action-icon">❤️</div><span>0</span></button>
            <button class="action-btn-vertical"><div class="action-icon">💬</div><span>0</span></button>
          </div>
        </div>
      `;
      observer.observe(newCard);
    } else {
      newCard.innerHTML = `
        <div class="reel-video-container">
          <img src="${selectedMediaUrl}" class="media-preview" alt="User Photo">
        </div>
        <div class="reel-overlay">
          <div class="reel-info">
            <div class="creator">@you</div>
            <div class="caption">${captionText}</div>
          </div>
          <div class="reel-actions">
            <button class="action-btn-vertical"><div class="action-icon">❤️</div><span>0</span></button>
            <button class="action-btn-vertical"><div class="action-icon">💬</div><span>0</span></button>
          </div>
        </div>
      `;
    }

    feed.prepend(newCard);
    closeCreateModal();
    feed.scrollTop = 0;

    document.getElementById('reel-caption').value = '';
    document.getElementById('preview-video').style.display = 'none';
    document.getElementById('preview-image').style.display = 'none';
    document.getElementById('upload-placeholder').style.display = 'block';
    selectedMediaUrl = null;
    selectedMediaType = null;
  }
</script>
